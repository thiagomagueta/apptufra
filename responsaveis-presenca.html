<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#651b1d"
  >

  <title>
    Responsáveis pela Presença | TUFRA
  </title>

  <link
    rel="stylesheet"
    href="layout.css?v=39"
  >

</head>


<body>

  <main class="app">

    <div class="conteudo-app">


      <header class="cabecalho-app">

        <img
          class="logo-app"
          src="logo-tufra.png"
          alt="Logo da TUFRA"
        >

        <div class="identidade-app">

          <strong>
            TUFRA
          </strong>

          <span>
            Tenda de Umbanda Francisco de Assis
          </span>

        </div>

      </header>


      <section>

        <h1 class="titulo-pagina">
          Responsáveis pela Presença
        </h1>

        <p class="subtitulo-pagina">
          Selecione uma lista para definir quem poderá preenchê-la.
        </p>

      </section>


      <section class="cartao-app">

        <h2>
          Listas de presença
        </h2>

        <div
          id="listaTiposPresenca"
          class="lista-acoes-administrativas"
        >

          <p>
            Carregando listas...
          </p>

        </div>

        <div
          id="mensagemSemTiposPresenca"
          class="mensagem-sem-atividades"
          hidden
        >
          Nenhuma lista de presença encontrada.
        </div>

      </section>


      <a
        class="link-administrativo"
        href="adm-permissoes.html"
      >
        Voltar para Permissões
      </a>


    </div>

  </main>


  <div id="menuGlobalTufra"></div>


  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="supabase.js?v=2"></script>

  <script src="menu-global.js?v=1"></script>

  <script src="app.js?v=2"></script>

  <script src="responsaveis-presenca.js?v=1"></script>

  <script src="menu-adm.js?v=1"></script>

  <script src="menu-financeiro.js?v=1"></script>
</body>

</html>
