<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#651b1d"
  >

  <title>
    Detalhes do Comunicado | TUFRA
  </title>

  <link
    rel="stylesheet"
    href="layout.css?v=40"
  >

</head>


<body>

  <main class="app">

    <div class="conteudo-app">


      <!-- =====================================
           CABEÇALHO
      ====================================== -->

      <header class="cabecalho-app">

        <img
          class="logo-app"
          src="logo-tufra.png"
          alt="Logo da TUFRA"
        >

        <div class="identidade-app">

          <strong>
            TUFRA
          </strong>

          <span>
            Tenda de Umbanda Francisco de Assis
          </span>

        </div>

      </header>


      <!-- =====================================
           TÍTULO
      ====================================== -->

      <section>

        <h1
          id="tituloPagina"
          class="titulo-pagina"
        >
          Comunicado
        </h1>

        <p
          id="subtituloPagina"
          class="subtitulo-pagina"
        >
          Carregando informações...
        </p>

      </section>


      <!-- =====================================
           DETALHES
      ====================================== -->

      <section
        id="cartaoDetalhesComunicado"
        class="cartao-app"
        hidden
      >

        <div class="campo-formulario">

          <label
            for="tipoComunicado"
          >
            Tipo
          </label>

          <input
            id="tipoComunicado"
            type="text"
            readonly
          >

        </div>


        <div class="campo-formulario">

          <label
            for="tituloComunicado"
          >
            Título
          </label>

          <input
            id="tituloComunicado"
            type="text"
            maxlength="120"
          >

        </div>


        <div class="campo-formulario">

          <label
            for="mensagemComunicado"
          >
            Mensagem
          </label>

          <textarea
            id="mensagemComunicado"
            rows="6"
          ></textarea>

        </div>


        <div class="campo-formulario">

          <label
            for="dataInicio"
          >
            Início da exibição
          </label>

          <input
            id="dataInicio"
            type="datetime-local"
          >

        </div>


        <div class="campo-formulario">

          <label
            for="dataFim"
          >
            Fim da exibição
          </label>

          <input
            id="dataFim"
            type="datetime-local"
          >

        </div>


        <div class="campo-formulario">

          <label>
            Público
          </label>

          <p
            id="publicoComunicado"
          >
          </p>

        </div>


        <div class="campo-formulario">

          <label>
            Publicado por
          </label>

          <p
            id="publicadoPorComunicado"
          >
          </p>

        </div>


        <div class="campo-formulario">

          <label>
            Status
          </label>

          <p
            id="statusComunicado"
          >
          </p>

        </div>


        <!-- =================================
             MENSAGEM
        ================================== -->

        <p
          id="mensagemFormulario"
          class="mensagem-formulario"
          hidden
        ></p>


        <!-- =================================
             SALVAR
        ================================== -->

        <button
          id="botaoSalvarAlteracoes"
          class="botao-principal-app"
          type="button"
        >
          Salvar alterações
        </button>


        <!-- =================================
             ENCERRAR
        ================================== -->

        <button
          id="botaoEncerrarComunicado"
          class="botao-secundario-app"
          type="button"
        >
          Encerrar agora
        </button>

      </section>


      <!-- =====================================
           ERRO
      ====================================== -->

      <section
        id="cartaoErroComunicado"
        class="cartao-app"
        hidden
      >

        <p>
          Não foi possível carregar este comunicado.
        </p>

      </section>


      <!-- =====================================
           VOLTAR
      ====================================== -->

      <a
        class="link-administrativo"
        href="adm-comunicados.html"
      >
        Voltar para Recados e Enquetes
      </a>


    </div>

  </main>


  <!-- =====================================
       MENU INFERIOR
  ====================================== -->

  <nav
    class="menu-inferior"
    aria-label="Navegação principal"
  >

    <div class="menu-inferior-conteudo">


      <a
        class="item-menu"
        href="dashboard.html"
      >

        <span class="icone-menu">
          ⌂
        </span>

        <span class="texto-menu">
          Início
        </span>

      </a>


      <a
        class="item-menu"
        href="calendario.html"
      >

        <span class="icone-menu">
          📅
        </span>

        <span class="texto-menu">
          Calendário
        </span>

      </a>


      <a
        class="item-menu"
        href="minha-ficha.html"
      >

        <span class="icone-menu">
          👤
        </span>

        <span class="texto-menu">
          Minha ficha
        </span>

      </a>


      <a
        id="itemMenuAdm"
        class="item-menu ativo"
        href="administrativo.html"
        hidden
      >

        <span class="icone-menu">
          ☰
        </span>

        <span class="texto-menu">
          ADM
        </span>

      </a>


      <a
        class="item-menu"
        href="#"
        id="botaoSair"
      >

        <span class="icone-menu">
          🚪
        </span>

        <span class="texto-menu">
          Sair
        </span>

      </a>


    </div>

  </nav>


  <!-- =====================================
       SCRIPTS
  ====================================== -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="supabase.js?v=2"></script>

  <script src="app.js?v=2"></script>

  <script src="adm-comunicado-detalhe.js?v=1"></script>

  <script src="menu-adm.js?v=1"></script>


</body>

</html>
