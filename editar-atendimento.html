<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#651b1d"
  >

  <title>
    Editar Atendimento | TUFRA
  </title>

  <link
    rel="stylesheet"
    href="layout.css?v=40"
  >

</head>


<body>

  <main class="app">

    <div class="conteudo-app">


      <!-- =====================================
           CABEÇALHO
      ====================================== -->

      <header class="cabecalho-app">

        <img
          class="logo-app"
          src="logo-tufra.png"
          alt="Logo da TUFRA"
        >

        <div class="identidade-app">

          <strong>
            TUFRA
          </strong>

          <span>
            Tenda de Umbanda Francisco de Assis
          </span>

        </div>

      </header>


      <!-- =====================================
           TÍTULO
      ====================================== -->

      <section>

        <h1 class="titulo-pagina">
          Editar Atendimento
        </h1>

        <p class="subtitulo-pagina">
          Atualize as informações do atendimento registrado.
        </p>

      </section>


      <!-- =====================================
           FORMULÁRIO
      ====================================== -->

      <section class="cartao-app">


        <!-- =================================
             PESSOA ATENDIDA
        ================================== -->

        <div
          style="
            margin-bottom: 22px;
          "
        >

          <strong>
            Pessoa atendida
          </strong>

          <p
            id="nomePessoaAtendida"
            style="
              margin-top: 6px;
            "
          >
            Carregando...
          </p>

        </div>


        <!-- =================================
             DATA
        ================================== -->

        <div
          style="
            margin-bottom: 20px;
          "
        >

          <label
            for="dataAtendimento"
            style="
              display: block;
              margin-bottom: 6px;
              font-weight: 600;
            "
          >
            Data do atendimento
          </label>

          <input
            id="dataAtendimento"
            type="date"
            style="
              width: 100%;
              box-sizing: border-box;
              padding: 12px;
              border: 1px solid #ccc;
              border-radius: 8px;
              font-size: 16px;
            "
          >

        </div>


        <!-- =================================
             MOTIVO
        ================================== -->

        <div
          style="
            margin-bottom: 20px;
          "
        >

          <label
            for="motivoAtendimento"
            style="
              display: block;
              margin-bottom: 6px;
              font-weight: 600;
            "
          >
            Motivo do atendimento
          </label>

          <input
            id="motivoAtendimento"
            type="text"
            style="
              width: 100%;
              box-sizing: border-box;
              padding: 12px;
              border: 1px solid #ccc;
              border-radius: 8px;
              font-size: 16px;
            "
          >

        </div>


        <!-- =================================
             RELATO
        ================================== -->

        <div
          style="
            margin-bottom: 24px;
          "
        >

          <label
            for="relatoAtendimento"
            style="
              display: block;
              margin-bottom: 8px;
              font-weight: 600;
            "
          >
            Relato
          </label>


          <div
            style="
              display: flex;
              flex-wrap: wrap;
              gap: 8px;
              margin-bottom: 10px;
            "
          >

            <button
              id="botaoFalarTextoRelato"
              type="button"
              style="
                padding: 8px 12px;
                border: 1px solid #bbb;
                border-radius: 8px;
                background: #fff;
                font-size: 14px;
                cursor: pointer;
              "
            >
              🎤 Falar para texto
            </button>


            <button
              id="botaoGravarRelato"
              type="button"
              style="
                padding: 8px 12px;
                border: 1px solid #bbb;
                border-radius: 8px;
                background: #fff;
                font-size: 14px;
                cursor: pointer;
              "
            >
              🎙️ Gravar novo áudio
            </button>

          </div>


          <textarea
            id="relatoAtendimento"
            rows="8"
            style="
              width: 100%;
              box-sizing: border-box;
              padding: 12px;
              border: 1px solid #ccc;
              border-radius: 8px;
              font-size: 16px;
              font-family: inherit;
              resize: vertical;
            "
          ></textarea>


          <p
            id="statusFalaTextoRelato"
            style="
              margin-top: 8px;
              margin-bottom: 0;
              font-size: 13px;
            "
            hidden
          ></p>


          <!-- ÁUDIO ATUAL / NOVO ÁUDIO DO RELATO -->

          <div
            id="areaAudioRelato"
            style="
              margin-top: 12px;
              padding: 12px;
              border: 1px solid #ddd;
              border-radius: 8px;
            "
            hidden
          >

            <div
              id="statusAudioRelato"
              style="
                margin-bottom: 10px;
                font-size: 14px;
                font-weight: 600;
              "
            ></div>


            <audio
              id="playerAudioRelato"
              hidden
            ></audio>


            <div
              style="
                display: flex;
                flex-wrap: wrap;
                gap: 8px;
                align-items: center;
              "
            >

              <button
                id="botaoReproduzirAudioRelato"
                type="button"
                style="
                  padding: 8px 12px;
                  border: 1px solid #bbb;
                  border-radius: 8px;
                  background: #fff;
                  font-size: 14px;
                  cursor: pointer;
                "
                hidden
              >
                ▶ Reproduzir
              </button>


              <button
                id="botaoPararAudioRelato"
                type="button"
                style="
                  padding: 8px 12px;
                  border: 1px solid #bbb;
                  border-radius: 8px;
                  background: #fff;
                  font-size: 14px;
                  cursor: pointer;
                "
                hidden
              >
                ■ Parar
              </button>


              <span
                id="duracaoAudioRelato"
                style="
                  font-size: 14px;
                  font-weight: 600;
                "
                hidden
              ></span>


              <button
                id="botaoApagarAudioRelato"
                type="button"
                style="
                  padding: 8px 12px;
                  border: 1px solid #bbb;
                  border-radius: 8px;
                  background: #fff;
                  font-size: 14px;
                  cursor: pointer;
                "
                hidden
              >
                🗑️ Apagar áudio
              </button>

            </div>

          </div>

        </div>


        <!-- =================================
             ORIENTAÇÃO / CONDUTA
        ================================== -->

        <div
          style="
            margin-bottom: 24px;
          "
        >

          <label
            for="orientacaoAtendimento"
            style="
              display: block;
              margin-bottom: 8px;
              font-weight: 600;
            "
          >
            Orientação / Conduta
          </label>


          <div
            style="
              display: flex;
              flex-wrap: wrap;
              gap: 8px;
              margin-bottom: 10px;
            "
          >

            <button
              id="botaoFalarTextoOrientacao"
              type="button"
              style="
                padding: 8px 12px;
                border: 1px solid #bbb;
                border-radius: 8px;
                background: #fff;
                font-size: 14px;
                cursor: pointer;
              "
            >
              🎤 Falar para texto
            </button>


            <button
              id="botaoGravarOrientacao"
              type="button"
              style="
                padding: 8px 12px;
                border: 1px solid #bbb;
                border-radius: 8px;
                background: #fff;
                font-size: 14px;
                cursor: pointer;
              "
            >
              🎙️ Gravar novo áudio
            </button>

          </div>


          <textarea
            id="orientacaoAtendimento"
            rows="7"
            style="
              width: 100%;
              box-sizing: border-box;
              padding: 12px;
              border: 1px solid #ccc;
              border-radius: 8px;
              font-size: 16px;
              font-family: inherit;
              resize: vertical;
            "
          ></textarea>


          <p
            id="statusFalaTextoOrientacao"
            style="
              margin-top: 8px;
              margin-bottom: 0;
              font-size: 13px;
            "
            hidden
          ></p>


          <!-- ÁUDIO ATUAL / NOVO ÁUDIO -->

          <div
            id="areaAudioOrientacao"
            style="
              margin-top: 12px;
              padding: 12px;
              border: 1px solid #ddd;
              border-radius: 8px;
            "
            hidden
          >

            <div
              id="statusAudioOrientacao"
              style="
                margin-bottom: 10px;
                font-size: 14px;
                font-weight: 600;
              "
            ></div>


            <audio
              id="playerAudioOrientacao"
              hidden
            ></audio>


            <div
              style="
                display: flex;
                flex-wrap: wrap;
                gap: 8px;
                align-items: center;
              "
            >

              <button
                id="botaoReproduzirAudioOrientacao"
                type="button"
                style="
                  padding: 8px 12px;
                  border: 1px solid #bbb;
                  border-radius: 8px;
                  background: #fff;
                  font-size: 14px;
                  cursor: pointer;
                "
                hidden
              >
                ▶ Reproduzir
              </button>


              <button
                id="botaoPararAudioOrientacao"
                type="button"
                style="
                  padding: 8px 12px;
                  border: 1px solid #bbb;
                  border-radius: 8px;
                  background: #fff;
                  font-size: 14px;
                  cursor: pointer;
                "
                hidden
              >
                ■ Parar
              </button>


              <span
                id="duracaoAudioOrientacao"
                style="
                  font-size: 14px;
                  font-weight: 600;
                "
                hidden
              ></span>


              <button
                id="botaoApagarAudioOrientacao"
                type="button"
                style="
                  padding: 8px 12px;
                  border: 1px solid #bbb;
                  border-radius: 8px;
                  background: #fff;
                  font-size: 14px;
                  cursor: pointer;
                "
                hidden
              >
                🗑️ Apagar áudio
              </button>

            </div>

          </div>

        </div>


        <!-- =================================
             ACOMPANHAMENTO
        ================================== -->

        <div
          style="
            margin-bottom: 20px;
          "
        >

          <label
            style="
              display: flex;
              align-items: center;
              gap: 10px;
              cursor: pointer;
            "
          >

            <input
              id="precisaAcompanhamento"
              type="checkbox"
            >

            <span>
              Precisa de acompanhamento / retorno
            </span>

          </label>

        </div>


        <!-- =================================
             DATA DE RETORNO
        ================================== -->

        <div
          id="areaDataRetorno"
          style="
            margin-bottom: 22px;
          "
          hidden
        >

          <label
            for="dataRetorno"
            style="
              display: block;
              margin-bottom: 6px;
              font-weight: 600;
            "
          >
            Data sugerida para retorno
          </label>

          <input
            id="dataRetorno"
            type="date"
            style="
              width: 100%;
              box-sizing: border-box;
              padding: 12px;
              border: 1px solid #ccc;
              border-radius: 8px;
              font-size: 16px;
            "
          >

        </div>


      </section>


      <!-- =====================================
           MENSAGEM
      ====================================== -->

      <p
        id="mensagemEditarAtendimento"
        class="mensagem-formulario"
        hidden
      ></p>


      <!-- =====================================
           SALVAR
      ====================================== -->

      <button
        id="botaoSalvarAlteracoes"
        class="botao-principal-app"
        type="button"
        disabled
      >
        Salvar alterações
      </button>


      <a
        id="linkVoltarAtendimentos"
        class="link-administrativo"
        href="adm-atendimentos.html"
      >
        Voltar
      </a>


    </div>

  </main>


  <!-- =====================================
       MENU INFERIOR
  ====================================== -->

  <nav
    class="menu-inferior"
    aria-label="Navegação principal"
  >

    <div class="menu-inferior-conteudo">

      <a
        class="item-menu"
        href="dashboard.html"
      >
        <span class="icone-menu">⌂</span>
        <span class="texto-menu">Início</span>
      </a>

      <a
        class="item-menu"
        href="calendario.html"
      >
        <span class="icone-menu">📅</span>
        <span class="texto-menu">Calendário</span>
      </a>

      <a
        class="item-menu"
        href="minha-ficha.html"
      >
        <span class="icone-menu">👤</span>
        <span class="texto-menu">Minha ficha</span>
      </a>

      <a
        id="itemMenuAdm"
        class="item-menu ativo"
        href="administrativo.html"
        hidden
      >
        <span class="icone-menu">☰</span>
        <span class="texto-menu">ADM</span>
      </a>

      <a
        class="item-menu"
        href="#"
        id="botaoSair"
      >
        <span class="icone-menu">🚪</span>
        <span class="texto-menu">Sair</span>
      </a>

    </div>

  </nav>


  <!-- =====================================
       SCRIPTS
  ====================================== -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="supabase.js?v=2"></script>

  <script src="app.js?v=2"></script>

  <script src="editar-atendimento.js?v=2"></script>

  <script src="menu-adm.js?v=1"></script>

</body>

</html>
