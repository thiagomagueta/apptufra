<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#651b1d"
  >

  <title>
    Editar Atendimento | TUFRA
  </title>

  <link
    rel="stylesheet"
    href="layout.css?v=40"
  >

</head>


<body>

  <main class="app">

    <div class="conteudo-app">


      <header class="cabecalho-app">

        <img
          class="logo-app"
          src="logo-tufra.png"
          alt="Logo da TUFRA"
        >

        <div class="identidade-app">

          <strong>
            TUFRA
          </strong>

          <span>
            Tenda de Umbanda Francisco de Assis
          </span>

        </div>

      </header>


      <section>

        <h1 class="titulo-pagina">
          Editar Atendimento
        </h1>

        <p class="subtitulo-pagina">
          Atualize as informações do atendimento registrado.
        </p>

      </section>


      <section class="cartao-app">


        <div
          style="
            margin-bottom: 22px;
          "
        >

          <strong>
            Pessoa atendida
          </strong>

          <p
            id="nomePessoaAtendida"
            style="
              margin-top: 6px;
            "
          >
            Carregando...
          </p>

        </div>


        <div
          style="
            margin-bottom: 20px;
          "
        >

          <label
            for="dataAtendimento"
            style="
              display: block;
              margin-bottom: 6px;
              font-weight: 600;
            "
          >
            Data do atendimento
          </label>

          <input
            id="dataAtendimento"
            type="date"
            style="
              width: 100%;
              box-sizing: border-box;
              padding: 12px;
              border: 1px solid #ccc;
              border-radius: 8px;
              font-size: 16px;
            "
          >

        </div>


        <div
          style="
            margin-bottom: 20px;
          "
        >

          <label
            for="motivoAtendimento"
            style="
              display: block;
              margin-bottom: 6px;
              font-weight: 600;
            "
          >
            Motivo do atendimento
          </label>

          <input
            id="motivoAtendimento"
            type="text"
            style="
              width: 100%;
              box-sizing: border-box;
              padding: 12px;
              border: 1px solid #ccc;
              border-radius: 8px;
              font-size: 16px;
            "
          >

        </div>


        <div
          style="
            margin-bottom: 20px;
          "
        >

          <label
            for="relatoAtendimento"
            style="
              display: block;
              margin-bottom: 6px;
              font-weight: 600;
            "
          >
            Relato
          </label>

          <textarea
            id="relatoAtendimento"
            rows="8"
            style="
              width: 100%;
              box-sizing: border-box;
              padding: 12px;
              border: 1px solid #ccc;
              border-radius: 8px;
              font-size: 16px;
              font-family: inherit;
              resize: vertical;
            "
          ></textarea>

        </div>


        <div
          style="
            margin-bottom: 22px;
          "
        >

          <label
            for="orientacaoAtendimento"
            style="
              display: block;
              margin-bottom: 6px;
              font-weight: 600;
            "
          >
            Orientação / Conduta
          </label>

          <textarea
            id="orientacaoAtendimento"
            rows="7"
            style="
              width: 100%;
              box-sizing: border-box;
              padding: 12px;
              border: 1px solid #ccc;
              border-radius: 8px;
              font-size: 16px;
              font-family: inherit;
              resize: vertical;
            "
          ></textarea>

        </div>


        <div
          style="
            margin-bottom: 20px;
          "
        >

          <label
            style="
              display: flex;
              align-items: center;
              gap: 10px;
              cursor: pointer;
            "
          >

            <input
              id="precisaAcompanhamento"
              type="checkbox"
            >

            <span>
              Precisa de acompanhamento / retorno
            </span>

          </label>

        </div>


        <div
          id="areaDataRetorno"
          style="
            margin-bottom: 22px;
          "
          hidden
        >

          <label
            for="dataRetorno"
            style="
              display: block;
              margin-bottom: 6px;
              font-weight: 600;
            "
          >
            Data sugerida para retorno
          </label>

          <input
            id="dataRetorno"
            type="date"
            style="
              width: 100%;
              box-sizing: border-box;
              padding: 12px;
              border: 1px solid #ccc;
              border-radius: 8px;
              font-size: 16px;
            "
          >

        </div>


      </section>


      <p
        id="mensagemEditarAtendimento"
        class="mensagem-formulario"
        hidden
      ></p>


      <button
        id="botaoSalvarAlteracoes"
        class="botao-principal-app"
        type="button"
        disabled
      >
        Salvar alterações
      </button>


      <a
        id="linkVoltarAtendimentos"
        class="link-administrativo"
        href="adm-atendimentos.html"
      >
        Voltar
      </a>


    </div>

  </main>


  <nav
    class="menu-inferior"
    aria-label="Navegação principal"
  >

    <div class="menu-inferior-conteudo">

      <a
        class="item-menu"
        href="dashboard.html"
      >
        <span class="icone-menu">⌂</span>
        <span class="texto-menu">Início</span>
      </a>

      <a
        class="item-menu"
        href="calendario.html"
      >
        <span class="icone-menu">📅</span>
        <span class="texto-menu">Calendário</span>
      </a>

      <a
        class="item-menu"
        href="minha-ficha.html"
      >
        <span class="icone-menu">👤</span>
        <span class="texto-menu">Minha ficha</span>
      </a>

      <a
        id="itemMenuAdm"
        class="item-menu ativo"
        href="administrativo.html"
        hidden
      >
        <span class="icone-menu">☰</span>
        <span class="texto-menu">ADM</span>
      </a>

      <a
        class="item-menu"
        href="#"
        id="botaoSair"
      >
        <span class="icone-menu">🚪</span>
        <span class="texto-menu">Sair</span>
      </a>

    </div>

  </nav>


  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="supabase.js?v=2"></script>

  <script src="app.js?v=2"></script>

  <script src="editar-atendimento.js?v=1"></script>

  <script src="menu-adm.js?v=1"></script>

</body>

</html>
