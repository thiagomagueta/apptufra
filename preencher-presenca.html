<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#651b1d"
  >

  <title>
    Preencher Presença | TUFRA
  </title>

  <link
    rel="stylesheet"
    href="layout.css?v=23"
  >

</head>

<body>

  <main class="app">

    <div class="conteudo-app">


      <header class="cabecalho-app">

        <img
          class="logo-app"
          src="logo-tufra.png"
          alt="Logo da TUFRA"
        >

        <div class="identidade-app">

          <strong>
            TUFRA
          </strong>

          <span>
            Tenda de Umbanda Francisco de Assis
          </span>

        </div>

      </header>


      <section>

        <h1
          id="tituloPreencherPresenca"
          class="titulo-pagina"
        >
          Lista de Presença
        </h1>

        <p
          id="dadosAtividadePresenca"
          class="subtitulo-pagina"
        >
          Carregando atividade...
        </p>

      </section>


      <section class="cartao-app">

        <div class="cabecalho-lista-presenca">

          <h2>
            Associados
          </h2>

          <button
            id="botaoMarcarPendentes"
            class="botao-marcar-pendentes"
            type="button"
            disabled
          >
            Marcar pendentes como P
          </button>

        </div>


        <div
          id="listaChamadaPresenca"
          class="lista-chamada-presenca"
        >

          <p>
            Carregando associados...
          </p>

        </div>


        <div
          id="mensagemSemAssociadosPresenca"
          class="mensagem-sem-atividades"
          hidden
        >
          Nenhum associado encontrado para esta lista.
        </div>

      </section>


      <p
        id="mensagemSalvarPresenca"
        class="mensagem-formulario"
        hidden
      ></p>


      <button
        id="botaoSalvarPresenca"
        class="botao-principal-app"
        type="button"
        disabled
      >
        Salvar lista de presença
      </button>


      <a
        id="voltarAtividadesPresenca"
        class="link-administrativo"
        href="listas-presenca.html"
      >
        Voltar para atividades
      </a>


    </div>

  </main>


  <div id="menuGlobalTufra"></div>


  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="supabase.js?v=2"></script>

  <script src="menu-global.js?v=1"></script>

  <script src="app.js?v=2"></script>

  <script src="preencher-presenca.js?v=5"></script>

  <script src="menu-adm.js?v=1"></script>

  <script src="menu-financeiro.js?v=1"></script>
</body>

</html>
