<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#651b1d"
  >

  <title>
    Relatório por Atividade | TUFRA
  </title>

  <link
    rel="stylesheet"
    href="layout.css?v=39"
  >

</head>


<body>

  <main class="app">

    <div class="conteudo-app">


      <header class="cabecalho-app">

        <img
          class="logo-app"
          src="logo-tufra.png"
          alt="Logo da TUFRA"
        >

        <div class="identidade-app">

          <strong>
            TUFRA
          </strong>

          <span>
            Tenda de Umbanda Francisco de Assis
          </span>

        </div>

      </header>


      <section>

        <h1 class="titulo-pagina">
          Relatório por Atividade
        </h1>

        <p class="subtitulo-pagina">
          Consulte o resultado das atividades realizadas.
        </p>

      </section>


      <!-- =====================================
           FILTROS
      ====================================== -->

      <section class="cartao-app">

        <h2>
          Filtros
        </h2>


        <div class="filtros-relatorio-atividade">


          <div class="campo-filtro-relatorio-atividade">

            <label for="listaRelatorioAtividade">
              Lista
            </label>

            <select
              id="listaRelatorioAtividade"
              disabled
            >

              <option value="">
                Carregando...
              </option>

            </select>

          </div>


          <div class="campo-filtro-relatorio-atividade">

            <label for="anoRelatorioAtividade">
              Ano
            </label>

            <select
              id="anoRelatorioAtividade"
              disabled
            >

              <option value="">
                Selecione a lista
              </option>

            </select>

          </div>


        </div>

      </section>


      <!-- =====================================
           RELATÓRIO
      ====================================== -->

      <section
        id="areaRelatorioAtividade"
        class="cartao-app"
        hidden
      >

        <h2 id="tituloListaRelatorioAtividade">
          Frequência por atividade
        </h2>


        <div
          id="containerTabelaAtividade"
          class="container-tabela-atividade-relatorio"
        >

          <table
            class="tabela-atividade-relatorio"
          >

            <thead>

              <tr>

                <th>
                  Data
                </th>

                <th class="coluna-atividade-relatorio">
                  Atividade
                </th>

                <th>
                  P
                </th>

                <th>
                  F
                </th>

                <th>
                  J
                </th>

                <th>
                  Pend.
                </th>

                <th>
                  Freq.
                </th>

              </tr>

            </thead>


            <tbody
              id="corpoRelatorioAtividade"
            >

              <tr>

                <td colspan="7">
                  Carregando relatório...
                </td>

              </tr>

            </tbody>

          </table>

        </div>


        <div
          id="mensagemSemAtividadesRelatorio"
          class="mensagem-sem-atividades"
          hidden
        >
          Nenhuma atividade realizada neste ano.
        </div>

      </section>


      <!-- =====================================
           VOLTAR
      ====================================== -->

      <a
        class="link-administrativo"
        href="adm-relatorios.html"
      >
        Voltar para Relatórios
      </a>


    </div>

  </main>


  <!-- =====================================
       MENU INFERIOR
  ====================================== -->

  <div id="menuGlobalTufra"></div>


  <!-- =====================================
       SCRIPTS
  ====================================== -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="supabase.js?v=2"></script>

  <script src="menu-global.js?v=1"></script>

  <script src="app.js?v=2"></script>

  <script src="relatorio-atividade-lista.js?v=2"></script>

  <script src="menu-adm.js?v=1"></script>


  <script src="menu-financeiro.js?v=1"></script>
</body>

</html>
