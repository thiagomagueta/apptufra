<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#651b1d"
  >

  <title>
    Não responderam | TUFRA
  </title>

  <link
    rel="stylesheet"
    href="layout.css?v=40"

</head>


<body>

  <main class="app">

    <div class="conteudo-app">


      <!-- =====================================
           CABEÇALHO
      ====================================== -->

      <header class="cabecalho-app">

        <img
          class="logo-app"
          src="logo-tufra.png"
          alt="Logo da TUFRA"
        >

        <div class="identidade-app">

          <strong>
            TUFRA
          </strong>

          <span>
            Tenda de Umbanda Francisco de Assis
          </span>

        </div>

      </header>


      <!-- =====================================
           TÍTULO
      ====================================== -->

      <section>

        <h1 class="titulo-pagina">
          Quem ainda não respondeu
        </h1>

        <p class="subtitulo-pagina">
          Confira quem ainda não confirmou presença nem informou ausência.
        </p>

      </section>


      <!-- =====================================
           ATIVIDADE
      ====================================== -->

      <section class="cartao-app">

        <h2>
          Próxima atividade
        </h2>

        <div
          id="dadosAtividadeNaoResponderam"
          class="item-atividade"
        >

          <div class="dados-atividade">

            <span>
              Carregando atividade...
            </span>

          </div>

        </div>

      </section>


      <!-- =====================================
           LISTA
      ====================================== -->

      <section class="cartao-app">

        <h2>
          Ainda não responderam
        </h2>

        <div
          id="listaNaoResponderamAtividade"
          class="lista-ausentes-atividade"
        >

          <p>
            Carregando...
          </p>

        </div>

      </section>


      <section class="cartao-app"><button type="button" id="enviarWhatsappAtividade" class="botao-principal-app" style="width:100%;border:0;cursor:pointer;">Enviar relação pelo WhatsApp</button><p id="avisoWhatsappAtividade" role="status" style="font-size:13px;margin:8px 0 0;"></p></section>

      <!-- =====================================
           VOLTAR
      ====================================== -->

      <a
        href="dashboard.html"
        class="botao-principal-app"
      >
        Voltar
      </a>


    </div>

  </main>


  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="supabase.js?v=2"></script>

  <script src="app.js?v=2"></script>

  <script src="desenvolvimento-periodos.js?v=2"></script>
