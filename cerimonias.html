<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#651b1d"><title>Cerimônias | TUFRA</title><link rel="stylesheet" href="layout.css?v=40">
<style>
.cer-form{display:grid;gap:10px}.cer-form label{display:grid;gap:4px;font-weight:600}.cer-form input,.cer-form select{width:100%;padding:10px;border:1px solid #aaa;border-radius:8px;background:var(--cor-fundo,#fff);color:inherit}.cer-actions{display:flex;flex-wrap:wrap;gap:8px}.cer-actions button,.cer-actions a{padding:10px;border-radius:8px}.cer-card{padding:14px;border:1px solid #bbb;border-radius:10px;margin:12px 0}.cer-card p{margin:5px 0}.cer-hidden{display:none!important}.cer-status{min-height:24px}.cer-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
</style></head><body data-cerimonias-modo="gestao"><main class="app"><div class="conteudo-app"><header class="cabecalho-app"><img class="logo-app" src="logo-tufra.png" alt="Logo TUFRA"><div class="identidade-app"><strong>TUFRA</strong><span>Tenda de Umbanda Francisco de Assis</span></div></header>
<h1 class="titulo-pagina">Leitura de Búzios e Batismo</h1><p id="mensagem" class="cer-status" role="status">Carregando permissões...</p>
<section id="area" hidden>
<section class="cartao-app"><h2>Cerimônias</h2><label>Selecione a edição <select id="cerimonia"></select></label><div id="resumo"></div></section>



<section id="secInscricao" class="cartao-app" hidden><h2>Inscrever participante</h2><form id="formInscricao" class="cer-form"><label>Inscrição existente (opcional, para adicionar a segunda atividade)<select id="inscricaoExistente"><option value="">Nova inscrição</option></select></label><label>Origem<select id="origem"><option value="associado">Associado TUFRA</option><option value="externo">Participante externo</option></select></label><label id="campoAssociado">Associado<select name="associado_id" id="associado"></select></label><label id="campoExterno" hidden>Nome completo<input name="nome_externo" maxlength="200"></label><label><input type="checkbox" name="leitura" id="leitura"> Leitura de Búzios</label><label><input type="checkbox" name="batismo" id="batismo"> Batismo</label><label id="campoPeriodo" hidden>Período da leitura<select name="periodo_leitura_id" id="periodo"></select></label><div id="camposPadrinhos" hidden><label>Padrinho<input name="padrinho" maxlength="200"></label><label>Madrinha<input name="madrinha" maxlength="200"></label></div><button type="submit">Registrar interesse</button></form></section>
<section class="cartao-app"><h2>Períodos de leitura</h2><div id="periodos"></div></section><section class="cartao-app"><h2>Participantes</h2><div id="participantes"></div></section></section>
<a class="link-administrativo" href="administrativo.html">Voltar ao Administrativo</a></div></main><div id="menuGlobalTufra"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase.js?v=2"></script><script src="menu-global.js?v=1"></script><script src="app.js?v=2"></script><script src="cerimonias.js?v=1"></script></body></html>
