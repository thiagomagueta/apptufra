<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#651b1d"><title>Categorias | TUFRA</title><link rel="stylesheet" href="layout.css?v=40"><style>[hidden]{display:none!important}.campo-categoria{display:block;width:100%;box-sizing:border-box;padding:10px;margin:6px 0 14px;border:1px solid #ccc;border-radius:8px;font:inherit}.botao-categoria{padding:9px 12px;border:1px solid #ccc;border-radius:8px;background:#f5f5f5;font:inherit;cursor:pointer}.categoria{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid #ddd;overflow-wrap:anywhere}.categoria span{min-width:0}.categoria button{flex-shrink:0}.acoes-categoria{display:flex;gap:10px;flex-wrap:wrap}</style></head><body><main class="app"><div class="conteudo-app"><header class="cabecalho-app"><img class="logo-app" src="logo-tufra.png" alt="Logo da TUFRA"><div class="identidade-app"><strong>TUFRA</strong><span>Tenda de Umbanda Francisco de Assis</span></div></header><h1 class="titulo-pagina">Categorias</h1><p class="subtitulo-pagina">Receitas e despesas da TUFRA.</p><p id="mensagemCategorias" role="status" aria-live="polite">Verificando acesso...</p><section id="conteudoCategorias" hidden><div class="cartao-app"><h2 id="tituloFormulario">Nova categoria</h2><form id="formCategoria"><label for="tipoCategoria">Tipo</label><select id="tipoCategoria" class="campo-categoria"><option value="receita">Receita</option><option value="despesa">Despesa</option></select><label for="nomeCategoria">Nome</label><input id="nomeCategoria" class="campo-categoria" maxlength="80" required><label><input id="ativaCategoria" type="checkbox" checked> Categoria ativa</label><p>Ao desativar, a categoria continua no histórico.</p><div class="acoes-categoria"><button id="salvarCategoria" class="botao-categoria" type="submit">Salvar categoria</button><button id="cancelarCategoria" class="botao-categoria" type="button" hidden>Cancelar edição</button></div></form></div><div class="cartao-app"><h2>Receitas</h2><div id="receitasCategorias"></div></div><div class="cartao-app"><h2>Despesas</h2><div id="despesasCategorias"></div></div></section><a class="link-administrativo" href="adm-financeiro.html">Voltar ao Financeiro</a></div></main><div id="menuGlobalTufra"></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase.js?v=2"></script><script src="menu-global.js?v=1"></script><script src="app.js?v=2"></script><script src="financeiro-categorias.js?v=1"></script><script src="menu-adm.js?v=1"></script><script src="menu-financeiro.js?v=1"></script></body></html>
