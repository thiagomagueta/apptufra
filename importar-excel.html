<!DOCTYPE html>
<html lang="pt-BR">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#651b1d"
  >

  <title>Importar Excel | TUFRA</title>

  <link
    rel="stylesheet"
    href="layout.css?v=14"
  >

</head>

<body>

  <main class="app">

    <div class="conteudo-app">


      <header class="cabecalho-app">

        <img
          class="logo-app"
          src="logo-tufra.png"
          alt="Logo da TUFRA"
        >

        <div class="identidade-app">

          <strong>
            TUFRA
          </strong>

          <span>
            Tenda de Umbanda Francisco de Assis
          </span>

        </div>

      </header>


      <section>

        <h1 class="titulo-pagina">
          Importar planilha Excel
        </h1>

        <p class="subtitulo-pagina">
          Selecione a planilha com as atividades que serão adicionadas ao calendário.
        </p>

      </section>


      <section class="cartao-app">

        <h2>
          Selecionar arquivo
        </h2>

        <label
          class="botao-selecionar-excel"
          for="arquivoExcel"
        >
          Selecionar planilha
        </label>

        <input
          id="arquivoExcel"
          type="file"
          accept=".xlsx,.xls"
          hidden
        >

        <div
          id="dadosArquivoExcel"
          class="dados-arquivo-excel"
          hidden
        >

          <strong id="nomeArquivoExcel"></strong>

          <span id="resumoArquivoExcel"></span>

        </div>

        <p
          id="mensagemImportarExcel"
          class="mensagem-formulario"
          hidden
        ></p>

      </section>


      <section
        id="areaPreviaExcel"
        class="cartao-app"
        hidden
      >

        <h2>
          Prévia da importação
        </h2>

        <div
          id="listaPreviaExcel"
          class="lista-previa-excel"
        ></div>

      </section>


      <section
        id="areaConfirmarImportacao"
        class="cartao-app"
        hidden
      >

        <button
          id="botaoImportarExcel"
          class="botao-principal-app"
          type="button"
          disabled
        >
          Importar atividades
        </button>

      </section>


      <a
        class="link-administrativo"
        href="administrativo.html"
      >
        Voltar ao Administrativo
      </a>

    </div>

  </main>


  <nav
    class="menu-inferior"
    aria-label="Navegação principal"
  >

    <div class="menu-inferior-conteudo">

      <a
        class="item-menu"
        href="dashboard.html"
      >
        <span class="icone-menu">⌂</span>
        <span class="texto-menu">Início</span>
      </a>

      <a
        class="item-menu"
        href="calendario.html"
      >
        <span class="icone-menu">📅</span>
        <span class="texto-menu">Calendário</span>
      </a>

      <a
        class="item-menu"
        href="minha-ficha.html"
      >
        <span class="icone-menu">👤</span>
        <span class="texto-menu">Minha ficha</span>
      </a>

      <a
        class="item-menu"
        href="mais.html"
      >
        <span class="icone-menu">☰</span>
        <span class="texto-menu">Mais</span>
      </a>

      <a
        class="item-menu"
        href="#"
        id="botaoSair"
      >
        <span class="icone-menu">🚪</span>
        <span class="texto-menu">Sair</span>
      </a>

    </div>

  </nav>


  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="supabase.js?v=2"></script>

  <script src="app.js?v=2"></script>

  <script
    src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"
  ></script>

  <script src="importar-excel.js?v=1"></script>

</body>
</html>
