<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#651b1d"
  >

  <title>
    Atividades da Presença | TUFRA
  </title>

  <link
    rel="stylesheet"
    href="layout.css?v=22"
  >

</head>


<body>

  <main class="app">

    <div class="conteudo-app">


      <header class="cabecalho-app">

        <img
          class="logo-app"
          src="logo-tufra.png"
          alt="Logo da TUFRA"
        >

        <div class="identidade-app">

          <strong>
            TUFRA
          </strong>

          <span>
            Tenda de Umbanda Francisco de Assis
          </span>

        </div>

      </header>


      <section>

        <h1
          id="tituloListaPresenca"
          class="titulo-pagina"
        >
          Lista de Presença
        </h1>

        <p class="subtitulo-pagina">
          Selecione a atividade que deseja preencher.
        </p>

      </section>


      <section class="cartao-app">

        <h2>
          Atividades
        </h2>

        <div
          id="listaAtividadesPresenca"
          class="lista-atividades-presenca"
        >

          <p>
            Carregando atividades...
          </p>

        </div>

        <div
          id="mensagemSemAtividadesPresenca"
          class="mensagem-sem-atividades"
          hidden
        >
          Nenhuma atividade encontrada para esta lista.
        </div>

      </section>


      <a
        class="link-administrativo"
        href="listas-presenca.html"
      >
        Voltar para Minhas Listas
      </a>


    </div>

  </main>


  <nav
    class="menu-inferior"
    aria-label="Navegação principal"
  >

    <div class="menu-inferior-conteudo">

      <a
        class="item-menu"
        href="dashboard.html"
      >
        <span class="icone-menu">⌂</span>
        <span class="texto-menu">Início</span>
      </a>

      <a
        class="item-menu"
        href="calendario.html"
      >
        <span class="icone-menu">📅</span>
        <span class="texto-menu">Calendário</span>
      </a>

      <a
        class="item-menu"
        href="minha-ficha.html"
      >
        <span class="icone-menu">👤</span>
        <span class="texto-menu">Minha ficha</span>
      </a>

      <a
        id="itemMenuAdm"
        class="item-menu ativo"
        href="administrativo.html"
        hidden
      >
        <span class="icone-menu">☰</span>
        <span class="texto-menu">ADM</span>
      </a>

      <a
        class="item-menu"
        href="#"
        id="botaoSair"
      >
        <span class="icone-menu">🚪</span>
        <span class="texto-menu">Sair</span>
      </a>

    </div>

  </nav>


  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="supabase.js?v=2"></script>

  <script src="app.js?v=2"></script>

  <script src="presenca-atividades.js?v=2"></script>

  <script src="menu-adm.js?v=1"></script>

</body>

</html>
