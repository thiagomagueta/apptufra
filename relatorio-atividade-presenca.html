<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#651b1d"
  >

  <title>
    Relatório por Atividade | TUFRA
  </title>

  <link
    rel="stylesheet"
    href="layout.css?v=33"
  >

</head>


<body>

  <main class="app">

    <div class="conteudo-app">


      <header class="cabecalho-app">

        <img
          class="logo-app"
          src="logo-tufra.png"
          alt="Logo da TUFRA"
        >

        <div class="identidade-app">

          <strong>
            TUFRA
          </strong>

          <span>
            Tenda de Umbanda Francisco de Assis
          </span>

        </div>

      </header>


      <section>

        <h1 class="titulo-pagina">
          Relatório por Atividade
        </h1>

        <p class="subtitulo-pagina">
          Selecione a lista que deseja consultar.
        </p>

      </section>


      <section class="cartao-app">

        <h2>
          Listas de presença
        </h2>

        <div
          id="listasRelatorioAtividade"
          class="lista-acoes-administrativas"
        >

          <p>
            Carregando listas...
          </p>

        </div>

        <div
          id="mensagemSemListasRelatorioAtividade"
          class="mensagem-sem-atividades"
          hidden
        >
          Nenhuma lista de presença encontrada.
        </div>

      </section>


      <a
        class="link-administrativo"
        href="administrativo.html"
      >
        Voltar ao Administrativo
      </a>


    </div>

  </main>


  <nav
    class="menu-inferior"
    aria-label="Navegação principal"
  >

    <div class="menu-inferior-conteudo">

      <a
        class="item-menu"
        href="dashboard.html"
      >
        <span class="icone-menu">⌂</span>
        <span class="texto-menu">Início</span>
      </a>

      <a
        class="item-menu"
        href="calendario.html"
      >
        <span class="icone-menu">📅</span>
        <span class="texto-menu">Calendário</span>
      </a>

      <a
        class="item-menu"
        href="minha-ficha.html"
      >
        <span class="icone-menu">👤</span>
        <span class="texto-menu">Minha ficha</span>
      </a>

      <a
        class="item-menu"
        href="mais.html"
      >
        <span class="icone-menu">☰</span>
        <span class="texto-menu">Mais</span>
      </a>

      <a
        class="item-menu"
        href="#"
        id="botaoSair"
      >
        <span class="icone-menu">🚪</span>
        <span class="texto-menu">Sair</span>
      </a>

    </div>

  </nav>


  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="supabase.js?v=2"></script>

  <script src="app.js?v=2"></script>

  <script src="relatorio-atividade-presenca.js?v=1"></script>

</body>

</html>
