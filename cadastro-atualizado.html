<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta name="theme-color" content="#651b1d">

  <title>Cadastro atualizado | TUFRA</title>

  <link rel="stylesheet" href="style.css?v=14">
</head>

<body>

  <main class="tela-cadastro">

    <section class="cartao-cadastro">

      <header class="cabecalho-cadastro">

        <img
          class="logo-cadastro"
          src="logo-tufra.png"
          alt="Logo da TUFRA"
        >

        <div
          style="
            width: 90px;
            height: 90px;
            margin: 20px auto;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #e1f3e7;
            color: #268247;
            font-size: 50px;
          "
        >
          ✓
        </div>

        <h1>Cadastro atualizado!</h1>

        <p>
          Suas alterações foram registradas
          com sucesso.
        </p>

      </header>

      <a
        class="botao-solicitar"
        href="minha-ficha.html"
        style="
          display: flex;
          align-items: center;
          justify-content: center;
          text-decoration: none;
        "
      >
        Voltar para minha ficha
      </a>

    </section>

  </main>

</body>
</html>
