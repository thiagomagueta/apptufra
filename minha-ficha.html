<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta name="theme-color" content="#651b1d">

  <title>Minha ficha | TUFRA</title>

  <link rel="stylesheet" href="layout.css?v=3">
  <link rel="stylesheet" href="style.css?v=14">
</head>

<body>

  <main class="app">

    <div class="conteudo-app">

      <header class="cabecalho-app">

        <img
          class="logo-app"
          src="logo-tufra.png"
          alt="Logo da TUFRA"
        >

        <div class="identidade-app">
          <strong>TUFRA</strong>
          <span>Tenda de Umbanda Francisco de Assis</span>
        </div>

      </header>

      <section>
        <h1 class="titulo-pagina">
          Minha ficha
        </h1>

        <p class="subtitulo-pagina">
          Consulte ou atualize seus dados cadastrais.
        </p>
      </section>

      <div
        id="mensagemMinhaFicha"
        class="aviso-ficha"
        hidden
      ></div>

      <section class="secao-revisao">

        <div class="titulo-revisao">
          <h2>Dados pessoais</h2>

<a href="associado1.html?modo=edicao">
  Editar
</a>
        </div>

        <div
          id="minhaFichaDadosPessoais"
          class="lista-revisao"
        ></div>

      </section>

      <section class="secao-revisao">

        <div class="titulo-revisao">
          <h2>Endereço e contato</h2>

<a href="associado2.html?modo=edicao">
  Editar
</a>
        </div>

        <div
          id="minhaFichaEnderecoContato"
          class="lista-revisao"
        ></div>

      </section>

      <section class="secao-revisao">

        <div class="titulo-revisao">
          <h2>Histórico na Umbanda</h2>

          <a href="associado3.html">
            Editar
          </a>
        </div>

        <div
          id="minhaFichaHistoricoUmbanda"
          class="lista-revisao"
        ></div>

      </section>

    </div>

  </main>

  <nav
    class="menu-inferior"
    aria-label="Navegação principal"
  >

    <div class="menu-inferior-conteudo">

      <a
        class="item-menu"
        href="dashboard.html"
      >
        <span class="icone-menu">⌂</span>
        <span class="texto-menu">Início</span>
      </a>

      <a
        class="item-menu"
        href="calendario.html"
      >
        <span class="icone-menu">📅</span>
        <span class="texto-menu">Calendário</span>
      </a>

      <a
        class="item-menu ativo"
        href="minha-ficha.html"
      >
        <span class="icone-menu">👤</span>
        <span class="texto-menu">Minha ficha</span>
      </a>

      <a
        class="item-menu"
        href="mais.html"
      >
        <span class="icone-menu">☰</span>
        <span class="texto-menu">Mais</span>
      </a>

      <a
        class="item-menu"
        href="#"
        id="botaoSair"
      >
        <span class="icone-menu">🚪</span>
        <span class="texto-menu">Sair</span>
      </a>

    </div>

  </nav>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js?v=2"></script>
  <script src="app.js?v=2"></script>
  <script src="minha-ficha.js?v=1"></script>
</body>
</html>
