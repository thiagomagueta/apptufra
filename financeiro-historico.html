<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#651b1d">
  <title>Histórico Financeiro | TUFRA</title>
  <link rel="stylesheet" href="layout.css?v=40">
</head>
<body>
  <main class="app">
    <div class="conteudo-app">
      <header class="cabecalho-app">
        <img class="logo-app" src="logo-tufra.png" alt="Logo da TUFRA">
        <div class="identidade-app">
          <strong>TUFRA</strong>
          <span>Tenda de Umbanda Francisco de Assis</span>
        </div>
      </header>

      <section>
        <h1 class="titulo-pagina">Histórico financeiro</h1>
        <p class="subtitulo-pagina">Consulte os pagamentos registrados em seu financeiro.</p>
      </section>

      <section class="cartao-app">
        <h2>Pagamentos realizados</h2>
        <p id="textoHistorico">Carregando seu histórico...</p>
        <div id="listaHistorico" hidden></div>
      </section>

      <a href="financeiro.html" style="display:block;width:100%;box-sizing:border-box;margin-top:12px;padding:12px;border:1px solid #651b1d;border-radius:8px;color:#651b1d;text-align:center;text-decoration:none;font-weight:600;">Voltar para Meu Financeiro</a>
    </div>
  </main>

  <div id="menuGlobalTufra"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js?v=2"></script>
  <script src="menu-global.js?v=1"></script>
  <script src="app.js?v=2"></script>
  <script src="financeiro-historico.js?v=1"></script>
  <script src="menu-adm.js?v=1"></script>
  <script src="menu-financeiro.js?v=1"></script>
</body>
</html>
