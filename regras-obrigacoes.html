<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#651b1d"
  >

  <title>
    Regras das Obrigações | TUFRA
  </title>

  <link
    rel="stylesheet"
    href="layout.css?v=40"
  >

</head>


<body>

  <main class="app">

    <div class="conteudo-app">


      <!-- =====================================
           CABEÇALHO
      ====================================== -->

      <header class="cabecalho-app">

        <img
          class="logo-app"
          src="logo-tufra.png"
          alt="Logo da TUFRA"
        >

        <div class="identidade-app">

          <strong>
            TUFRA
          </strong>

          <span>
            Tenda de Umbanda Francisco de Assis
          </span>

        </div>

      </header>


      <!-- =====================================
           TÍTULO
      ====================================== -->

      <section>

        <h1 class="titulo-pagina">
          Regras das Obrigações
        </h1>

        <p class="subtitulo-pagina">
          Defina como cada função participa das obrigações.
        </p>

      </section>


      <!-- =====================================
           CONTEÚDO
      ====================================== -->

      <section
        id="conteudoRegrasObrigacoes"
        class="cartao-app"
        hidden
      >

        <h2>
          Participação por função
        </h2>

        <p>
          Selecione para cada função se a participação será obrigatória, isenta ou opcional.
        </p>

        <p
          id="mensagemRegrasObrigacoes"
        >
          Carregando funções...
        </p>

        <div
          id="listaRegrasObrigacoes"
        ></div>

      </section>


      <!-- =====================================
           VOLTAR
      ====================================== -->

      <a
        class="link-administrativo"
        href="adm-permissoes.html"
      >
        Voltar às Permissões
      </a>


    </div>

  </main>


  <!-- =====================================
       MENU INFERIOR
  ====================================== -->

  <div id="menuGlobalTufra"></div>


  <!-- =====================================
       SCRIPTS
  ====================================== -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="supabase.js?v=2"></script>

  <script src="menu-global.js?v=1"></script>

  <script src="app.js?v=2"></script>

  <script src="regras-obrigacoes.js?v=1"></script>

  <script src="menu-adm.js?v=1"></script>


  <script src="menu-financeiro.js?v=1"></script>
</body>

</html>
