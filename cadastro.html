<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta name="theme-color" content="#651b1d">

  <title>Cadastro | TUFRA</title>

  <link rel="stylesheet" href="style.css?v=4">
</head>

<body>
  <main class="tela-cadastro">

    <section class="cartao-cadastro">

      <header class="cabecalho-cadastro">

        <a
          class="botao-voltar"
          href="index.html"
          aria-label="Voltar para o login"
        >
          Voltar
        </a>

        <img
          class="logo-cadastro"
          src="logo-tufra.png"
          alt="Logo da Tenda de Umbanda Francisco de Assis"
        >

        <h1>Cadastro de Usuário</h1>

        <p>Dados pessoais</p>

        <div class="progresso-cadastro">
          <div class="progresso-preenchido"></div>
        </div>

        <small>Passo 1 de 2</small>

      </header>

      <form
          id="formularioDadosPessoais"
        class="formulario-cadastro"
        action="cadastro2.html"
        method="get"
        novalidate
      >

        <div class="grupo-campo">
          <label for="nomeCompleto">Nome completo</label>

          <input
            id="nomeCompleto"
            name="nomeCompleto"
            type="text"
            placeholder="Digite seu nome completo"
            autocomplete="name"
            required
          >

          <small
            id="erroNome"
            class="mensagem-campo"
          ></small>
        </div>

        <div class="grupo-campo">
          <label for="cpf">CPF</label>

          <input
            id="cpf"
            name="cpf"
            type="text"
            placeholder="000.000.000-00"
            inputmode="numeric"
            maxlength="14"
            autocomplete="off"
            required
          >

          <small
            id="erroCpf"
            class="mensagem-campo"
          ></small>
        </div>

        <div class="grupo-campo">
          <label for="dataNascimento">Data de nascimento</label>

          <input
            id="dataNascimento"
            name="dataNascimento"
            type="text"
            placeholder="00/00/0000"
            inputmode="numeric"
            maxlength="10"
            autocomplete="bday"
            required
          >

          <small
            id="erroNascimento"
            class="mensagem-campo"
          ></small>
        </div>

        <div class="grupo-campo">
          <label for="telefone">Celular</label>

          <input
            id="telefone"
            name="telefone"
            type="tel"
            placeholder="(00) 00000-0000"
            inputmode="numeric"
            maxlength="15"
            autocomplete="tel"
            required
          >

          <small
            id="erroTelefone"
            class="mensagem-campo"
          ></small>
        </div>

        <div class="grupo-campo">
          <label for="email">E-mail</label>

          <input
            id="email"
            name="email"
            type="email"
            placeholder="Digite seu e-mail"
            autocomplete="email"
            required
          >

          <small
            id="erroEmail"
            class="mensagem-campo"
          ></small>
        </div>

        <button
          class="botao-proximo"
          type="submit"
        >
          Próximo →
        </button>

      </form>

    </section>

  </main>

  <script src="cadastro.js?v=3"></script>
</body>
</html>
