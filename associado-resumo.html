<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#651b1d"
  >

  <title>Associado | TUFRA</title>

  <link
    rel="stylesheet"
    href="layout.css?v=19"
  >

</head>


<body>

  <main class="app">

    <div class="conteudo-app">


      <!-- =====================================
           CABEÇALHO
      ====================================== -->

      <header class="cabecalho-app">

        <img
          class="logo-app"
          src="logo-tufra.png"
          alt="Logo da TUFRA"
        >

        <div class="identidade-app">

          <strong>
            TUFRA
          </strong>

          <span>
            Tenda de Umbanda Francisco de Assis
          </span>

        </div>

      </header>


      <!-- =====================================
           TÍTULO
      ====================================== -->

      <section>

        <h1
          id="tituloAssociadoResumo"
          class="titulo-pagina"
        >
          Associado
        </h1>

        <p class="subtitulo-pagina">
          Resumo do cadastro do associado.
        </p>

      </section>


      <!-- =====================================
           FOTO
      ====================================== -->

      <section class="cartao-app">

        <div class="resumo-associado-cabecalho">

          <img
            id="fotoAssociadoResumo"
            class="foto-associado-resumo"
            alt="Foto do associado"
            hidden
          >

          <div
            id="fotoAssociadoResumoPadrao"
            class="foto-associado-resumo-padrao"
          >
            👤
          </div>

        </div>

      </section>


      <!-- =====================================
           DADOS RESUMIDOS
      ====================================== -->

      <section class="cartao-app">

        <h2>
          Dados do associado
        </h2>

        <div
          id="dadosAssociadoResumo"
          class="dados-associado-resumo"
        ></div>

      </section>


      <!-- =====================================
           CADASTRO COMPLETO
      ====================================== -->

      <a
        id="botaoCadastroCompleto"
        class="botao-principal-app"
        href="#"
      >
        Ver cadastro completo
      </a>


      <p
        id="mensagemAssociadoResumo"
        class="mensagem-formulario"
        hidden
      ></p>


      <a
        class="link-administrativo"
        href="lista-associados.html"
      >
        Voltar para Lista de Associados
      </a>


    </div>

  </main>


  <!-- =====================================
       MODAL FOTO
  ====================================== -->

  <div
    id="modalFotoAssociado"
    class="modal-foto-usuario"
    hidden
  >

    <button
      id="fecharModalFotoAssociado"
      class="fechar-modal-foto"
      type="button"
      aria-label="Fechar foto"
    >
      ×
    </button>


    <div class="controles-zoom-foto">

      <button
        id="diminuirZoomFotoAssociado"
        type="button"
      >
        −
      </button>

      <button
        id="resetarZoomFotoAssociado"
        type="button"
      >
        100%
      </button>

      <button
        id="aumentarZoomFotoAssociado"
        type="button"
      >
        +
      </button>

    </div>


    <div
      id="areaZoomFotoAssociado"
      class="area-zoom-foto"
    >

      <img
        id="fotoAssociadoAmpliada"
        class="foto-usuario-ampliada"
        alt="Foto ampliada do associado"
      >

    </div>

  </div>


  <!-- =====================================
       MENU INFERIOR
  ====================================== -->

  <nav
    class="menu-inferior"
    aria-label="Navegação principal"
  >

    <div class="menu-inferior-conteudo">

      <a
        class="item-menu"
        href="dashboard.html"
      >
        <span class="icone-menu">⌂</span>
        <span class="texto-menu">Início</span>
      </a>

      <a
        class="item-menu"
        href="calendario.html"
      >
        <span class="icone-menu">📅</span>
        <span class="texto-menu">Calendário</span>
      </a>

      <a
        class="item-menu"
        href="minha-ficha.html"
      >
        <span class="icone-menu">👤</span>
        <span class="texto-menu">Minha ficha</span>
      </a>

      <a
        class="item-menu"
        href="mais.html"
      >
        <span class="icone-menu">☰</span>
        <span class="texto-menu">Mais</span>
      </a>

      <a
        class="item-menu"
        href="#"
        id="botaoSair"
      >
        <span class="icone-menu">🚪</span>
        <span class="texto-menu">Sair</span>
      </a>

    </div>

  </nav>


  <!-- =====================================
       SCRIPTS
  ====================================== -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="supabase.js?v=2"></script>

  <script src="app.js?v=2"></script>

  <script src="associado-resumo.js?v=2"></script>

</body>

</html>
