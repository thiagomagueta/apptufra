<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#651b1d"
  >

  <title>
    Presenças | TUFRA
  </title>

  <link
    rel="stylesheet"
    href="layout.css?v=40"
  >

</head>


<body>

  <main class="app">

    <div class="conteudo-app">


      <!-- =====================================
           CABEÇALHO
      ====================================== -->

      <header class="cabecalho-app">

        <img
          class="logo-app"
          src="logo-tufra.png"
          alt="Logo da TUFRA"
        >

        <div class="identidade-app">

          <strong>
            TUFRA
          </strong>

          <span>
            Tenda de Umbanda Francisco de Assis
          </span>

        </div>

      </header>


      <!-- =====================================
           TÍTULO
      ====================================== -->

      <section>

        <h1 class="titulo-pagina">
          Presenças da atividade
        </h1>

        <p class="subtitulo-pagina">
          Confira quem informou que estará presente.
        </p>

      </section>


      <!-- =====================================
           ATIVIDADE
      ====================================== -->

      <section class="cartao-app">

        <h2>
          Próxima atividade
        </h2>

        <div
          id="dadosAtividadePresencas"
          class="item-atividade"
        >

          <div class="dados-atividade">

            <span>
              Carregando atividade...
            </span>

          </div>

        </div>

      </section>


      <!-- =====================================
           LISTA DE PRESENTES
      ====================================== -->

      <section class="cartao-app">

        <h2>
          Confirmaram presença
        </h2>

        <div
          id="listaPresentesAtividade"
          class="lista-ausentes-atividade"
        >

          <p>
            Carregando presenças...
          </p>

        </div>

      </section>


      <!-- =====================================
           VOLTAR
      ====================================== -->

      <a
        href="dashboard.html"
        class="botao-principal-app"
      >
        Voltar
      </a>


    </div>

  </main>


  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="supabase.js?v=2"></script>

  <script src="app.js?v=2"></script>

  <script src="presencas-atividade.js?v=1"></script>

</body>

</html>
