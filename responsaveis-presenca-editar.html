<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#651b1d"
  >

  <title>
    Responsáveis pela Presença | TUFRA
  </title>

  <link
    rel="stylesheet"
    href="layout.css?v=18"
  >

</head>


<body>

  <main class="app">

    <div class="conteudo-app">


      <header class="cabecalho-app">

        <img
          class="logo-app"
          src="logo-tufra.png"
          alt="Logo da TUFRA"
        >

        <div class="identidade-app">

          <strong>
            TUFRA
          </strong>

          <span>
            Tenda de Umbanda Francisco de Assis
          </span>

        </div>

      </header>


      <section>

        <h1 class="titulo-pagina">
          Responsáveis
        </h1>

        <p
          id="nomeTipoLista"
          class="subtitulo-pagina"
        >
          Carregando lista...
        </p>

      </section>


      <section class="cartao-app">

        <h2>
          Quem poderá preencher esta lista?
        </h2>

        <div
          id="listaResponsaveisDisponiveis"
          class="lista-responsaveis-presenca"
        >
          <p>
            Carregando associados...
          </p>
        </div>

        <div
          id="mensagemSemResponsaveis"
          class="mensagem-sem-atividades"
          hidden
        >
          Nenhum associado encontrado.
        </div>

      </section>


      <p
        id="mensagemSalvarResponsaveis"
        class="mensagem-formulario"
        hidden
      ></p>


      <button
        id="botaoSalvarResponsaveis"
        class="botao-principal-app"
        type="button"
        disabled
      >
        Salvar responsáveis
      </button>


      <a
        class="link-administrativo"
        href="responsaveis-presenca.html"
      >
        Voltar para Listas de Presença
      </a>


    </div>

  </main>


  <nav
    class="menu-inferior"
    aria-label="Navegação principal"
  >

    <div class="menu-inferior-conteudo">

      <a
        class="item-menu"
        href="dashboard.html"
      >
        <span class="icone-menu">⌂</span>
        <span class="texto-menu">Início</span>
      </a>

      <a
        class="item-menu"
        href="calendario.html"
      >
        <span class="icone-menu">📅</span>
        <span class="texto-menu">Calendário</span>
      </a>

      <a
        class="item-menu"
        href="minha-ficha.html"
      >
        <span class="icone-menu">👤</span>
        <span class="texto-menu">Minha ficha</span>
      </a>

      <a
        class="item-menu"
        href="mais.html"
      >
        <span class="icone-menu">☰</span>
        <span class="texto-menu">Mais</span>
      </a>

      <a
        class="item-menu"
        href="#"
        id="botaoSair"
      >
        <span class="icone-menu">🚪</span>
        <span class="texto-menu">Sair</span>
      </a>

    </div>

  </nav>


  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="supabase.js?v=2"></script>

  <script src="app.js?v=2"></script>

  <script src="responsaveis-presenca-editar.js?v=1"></script>

</body>

</html>
