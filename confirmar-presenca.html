<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#651b1d"
  >

  <title>
    Confirmar Presença | TUFRA
  </title>

  <link
    rel="stylesheet"
    href="layout.css?v=40"
  >

</head>


<body>

  <main class="app">

    <div class="conteudo-app">


      <!-- =====================================
           CABEÇALHO
      ====================================== -->

      <header class="cabecalho-app">

        <img
          class="logo-app"
          src="logo-tufra.png"
          alt="Logo da TUFRA"
        >

        <div class="identidade-app">

          <strong>
            TUFRA
          </strong>

          <span>
            Tenda de Umbanda Francisco de Assis
          </span>

        </div>

      </header>


      <!-- =====================================
           TÍTULO
      ====================================== -->

      <section>

        <h1 class="titulo-pagina">
          Confirmar presença
        </h1>

        <p class="subtitulo-pagina">
          Informe se você estará presente na próxima atividade.
        </p>

      </section>


      <!-- =====================================
           ATIVIDADE
      ====================================== -->

      <section class="cartao-app">

        <h2>
          Próxima atividade
        </h2>

        <div
          id="dadosAtividadeConfirmacao"
          class="item-atividade"
        >

          <div class="dados-atividade">

            <span>
              Carregando atividade...
            </span>

          </div>

        </div>

      </section>


      <!-- =====================================
           CONFIRMAÇÃO
      ====================================== -->

      <section class="cartao-app">

        <h2>
          Você estará presente?
        </h2>


        <div class="opcoes-confirmacao-presenca">


          <label class="opcao-confirmacao-presenca">

            <input
              type="radio"
              name="confirmacaoPresenca"
              value="presente"
              id="opcaoEstareiPresente"
            >

            <span>
              Estarei presente
            </span>

          </label>


          <label class="opcao-confirmacao-presenca">

            <input
              type="radio"
              name="confirmacaoPresenca"
              value="ausente"
              id="opcaoNaoEstareiPresente"
            >

            <span>
              Não estarei presente
            </span>

          </label>


        </div>


        <!-- =====================================
             JUSTIFICATIVA
        ====================================== -->

        <div
          id="areaJustificativaPresenca"
          class="area-justificativa-presenca"
          hidden
        >

          <label
            for="justificativaPresenca"
            class="label-justificativa-presenca"
          >
            Justificativa da ausência
          </label>

          <textarea
            id="justificativaPresenca"
            class="campo-justificativa-presenca"
            rows="5"
            maxlength="500"
            placeholder="Se desejar, escreva aqui o motivo da sua ausência."
          ></textarea>

        </div>


        <!-- =====================================
             MENSAGEM
        ====================================== -->

        <div
          id="mensagemConfirmacaoPresenca"
          class="mensagem-confirmacao-presenca"
          hidden
        >
        </div>


        <!-- =====================================
             AÇÕES
        ====================================== -->

        <div class="acoes-confirmacao-presenca">

          <a
            href="dashboard.html"
            class="botao-voltar-confirmacao-presenca"
          >
            Voltar
          </a>

          <button
            type="button"
            id="botaoSalvarConfirmacaoPresenca"
            class="botao-salvar-confirmacao-presenca"
          >
            Salvar resposta
          </button>

        </div>

      </section>


    </div>

  </main>


  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="supabase.js?v=2"></script>

  <script src="app.js?v=2"></script>

  <script src="confirmar-presenca.js?v=1"></script>

</body>

</html>
