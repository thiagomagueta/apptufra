<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#651b1d"
  >

  <title>
    Lista de Associados Ativos | TUFRA
  </title>

  <link
    rel="stylesheet"
    href="layout.css?v=39"
  >

  <style>
    .filtros-associados label { display:block; font-weight:700; margin:0 0 8px; }
    .filtros-associados input, .filtros-associados select {
      display:block; width:100%; min-width:0; padding:12px; margin:0 0 16px;
      border:1px solid var(--cor-borda); border-radius:12px; background:#fff; color:var(--cor-texto); font:inherit;
    }
    .filtros-associados button { padding:10px 16px; border:1px solid var(--cor-principal); border-radius:12px; background:transparent; color:var(--cor-principal); font:inherit; cursor:pointer; }
    .funcao-entrada-lista-associado { display:flex; flex-direction:column; gap:5px; min-width:0; }
    .entrada-lista-associado { font-size:12px; font-weight:400; color:var(--cor-texto-suave); line-height:1.3; }
.data-horizontal-associado, .cabecalho-horizontal-associados { display:none; }
    @media (orientation: landscape) and (max-height: 650px) {
      .conteudo-app { max-width: none; }
      .filtros-associados { display:grid; grid-template-columns: repeat(3,minmax(0,1fr)); gap: 4px 12px; }
      .filtros-associados label { margin-bottom:0; align-self:end; }
      .filtros-associados input, .filtros-associados select { margin-bottom:8px; }
      .filtros-associados label[for="buscaNomeAssociado"] { grid-column:1; grid-row:1; }
      #buscaNomeAssociado { grid-column:1; grid-row:2; }
      .filtros-associados label[for="filtroFuncaoAssociado"] { grid-column:2; grid-row:1; }
      #filtroFuncaoAssociado { grid-column:2; grid-row:2; }
      .filtros-associados label[for="ordenacaoAssociados"] { grid-column:3; grid-row:1; }
      #ordenacaoAssociados { grid-column:3; grid-row:2; }
      #limparFiltrosAssociados { grid-column:1; justify-self:start; }
      #resultadoFiltrosAssociados { grid-column:2 / 4; align-self:center; }
      .cartao-lista-associados { overflow-x:auto; }
      .cabecalho-horizontal-associados { display:grid; }
      .cabecalho-horizontal-associados, .item-lista-associado {
        grid-template-columns:minmax(155px,2fr) minmax(110px,1.3fr) minmax(90px,1fr) minmax(90px,1fr) minmax(90px,1fr) 14px;
        min-width:690px; gap:8px; align-items:center;
      }
      .cabecalho-horizontal-associados { padding:8px 4px; font-size:11px; font-weight:700; color:var(--cor-principal); border-bottom:1px solid var(--cor-borda); }
      .item-lista-associado { padding:9px 4px; border-bottom:1px solid rgba(101,27,29,.09); }
      .funcao-entrada-lista-associado { display:contents; }
      .nome-lista-associado { grid-column:1; grid-row:1; font-size:12px; }
      .funcao-lista-associado { grid-column:2; grid-row:1; }
      .entrada-lista-associado { grid-column:3; grid-row:1; font-size:11px; }
      .entrada-lista-associado::first-letter { text-transform:uppercase; }
      .data-horizontal-associado { display:block; font-size:11px; color:var(--cor-texto); }
      .data-desenvolvimento-associado { grid-column:4; grid-row:1; }
      .data-principal-associado { grid-column:5; grid-row:1; }
      .seta-permissao-lista { grid-column:6; grid-row:1; }
    }
    #resultadoFiltrosAssociados { margin:14px 0 0; color:var(--cor-texto-suave); font-size:14px; }
  </style>
</head>


<body>

  <main class="app">

    <div class="conteudo-app">


      <header class="cabecalho-app">

        <img
          class="logo-app"
          src="logo-tufra.png"
          alt="Logo da TUFRA"
        >

        <div class="identidade-app">

          <strong>
            TUFRA
          </strong>

          <span>
            Tenda de Umbanda Francisco de Assis
          </span>

        </div>

      </header>


      <section>

        <h1 class="titulo-pagina">
          Lista de Associados Ativos
        </h1>

        <p class="subtitulo-pagina">
          Consulte os associados ativos da TUFRA.
        </p>

      </section>


      <section id="filtrosListaAssociados" class="cartao-app filtros-associados" hidden>
        <label for="buscaNomeAssociado">Buscar por nome</label>
        <input id="buscaNomeAssociado" type="search" placeholder="Digite o nome do associado" autocomplete="off">
        <label for="filtroFuncaoAssociado">Função</label>
        <select id="filtroFuncaoAssociado"><option value="">Todas as funções</option></select>
        <label for="ordenacaoAssociados">Ordenar por</label>
        <select id="ordenacaoAssociados">
          <option value="nome">Nome (A–Z)</option>
          <option value="antigos">Data de entrada — mais antigos</option>
          <option value="recentes">Data de entrada — mais recentes</option>
        </select>
        <button id="limparFiltrosAssociados" type="button">Limpar filtros</button>
        <p id="resultadoFiltrosAssociados" role="status" aria-live="polite"></p>
      </section>

      <section class="cartao-app cartao-lista-associados">
        <div class="cabecalho-horizontal-associados" aria-hidden="true">
          <span>Associado</span><span>Função</span><span>Entrada TUFRA</span><span>Corrente Desenv.</span><span>Corrente Principal</span><span></span>
        </div>
        <div
          id="listaAssociados"
          class="lista-associados"
        >
          <p>
            Carregando associados...
          </p>
        </div>

        <div
          id="mensagemSemAssociados"
          class="mensagem-sem-atividades"
          hidden
        >
          Nenhum associado encontrado.
        </div>

      </section>


      <a
        class="link-administrativo"
        href="adm-associados.html"
      >
        Voltar para Associados
      </a>


    </div>

  </main>


  <div id="menuGlobalTufra"></div>


  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="supabase.js?v=2"></script>

  <script src="menu-global.js?v=1"></script>

  <script src="app.js?v=20261027sab"></script>

  <script src="lista-associados.js?v=20261101horizontal2"></script>

  <script src="menu-adm.js?v=3"></script>

  <script src="menu-financeiro.js?v=1"></script>
</body>

</html>
