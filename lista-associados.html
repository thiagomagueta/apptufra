<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#651b1d"
  >

  <title>
    Lista de Associados Ativos | TUFRA
  </title>

  <link
    rel="stylesheet"
    href="layout.css?v=39"
  >

  <style>
    .filtros-associados label { display:block; font-weight:700; margin:0 0 8px; }
    .filtros-associados input, .filtros-associados select {
      display:block; width:100%; min-width:0; padding:12px; margin:0 0 16px;
      border:1px solid var(--cor-borda); border-radius:12px; background:#fff; color:var(--cor-texto); font:inherit;
    }
    .filtros-associados button { padding:10px 16px; border:1px solid var(--cor-principal); border-radius:12px; background:transparent; color:var(--cor-principal); font:inherit; cursor:pointer; }
    #resultadoFiltrosAssociados { margin:14px 0 0; color:var(--cor-texto-suave); font-size:14px; }
  </style>
</head>


<body>

  <main class="app">

    <div class="conteudo-app">


      <header class="cabecalho-app">

        <img
          class="logo-app"
          src="logo-tufra.png"
          alt="Logo da TUFRA"
        >

        <div class="identidade-app">

          <strong>
            TUFRA
          </strong>

          <span>
            Tenda de Umbanda Francisco de Assis
          </span>

        </div>

      </header>


      <section>

        <h1 class="titulo-pagina">
          Lista de Associados Ativos
        </h1>

        <p class="subtitulo-pagina">
          Consulte os associados ativos da TUFRA.
        </p>

      </section>


      <section id="filtrosListaAssociados" class="cartao-app filtros-associados" hidden>
        <label for="buscaNomeAssociado">Buscar por nome</label>
        <input id="buscaNomeAssociado" type="search" placeholder="Digite o nome do associado" autocomplete="off">
        <label for="filtroFuncaoAssociado">Função</label>
        <select id="filtroFuncaoAssociado"><option value="">Todas as funções</option></select>
        <button id="limparFiltrosAssociados" type="button">Limpar filtros</button>
        <p id="resultadoFiltrosAssociados" role="status" aria-live="polite"></p>
      </section>

      <section class="cartao-app">

        <div
          id="listaAssociados"
          class="lista-associados"
        >
          <p>
            Carregando associados...
          </p>
        </div>

        <div
          id="mensagemSemAssociados"
          class="mensagem-sem-atividades"
          hidden
        >
          Nenhum associado encontrado.
        </div>

      </section>


      <a
        class="link-administrativo"
        href="adm-associados.html"
      >
        Voltar para Associados
      </a>


    </div>

  </main>


  <div id="menuGlobalTufra"></div>


  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="supabase.js?v=2"></script>

  <script src="menu-global.js?v=1"></script>

  <script src="app.js?v=20261027sab"></script>

  <script src="lista-associados.js?v=20261027sab"></script>

  <script src="menu-adm.js?v=3"></script>

  <script src="menu-financeiro.js?v=1"></script>
</body>

</html>
