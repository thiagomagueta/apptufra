<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#651b1d"
  >

  <title>
    Recuperar senha | TUFRA
  </title>

  <link
    rel="stylesheet"
    href="style.css"
  >

</head>


<body>

  <main class="tela-login">

    <section class="cartao-login">


      <header class="cabecalho-login">

        <img
          class="logo-tufra"
          src="logo-tufra.png"
          alt="Logo da Tenda de Umbanda Francisco de Assis"
        >

        <h1>
          TUFRA
        </h1>

        <p>
          Tenda de Umbanda Francisco de Assis
        </p>

      </header>


      <section>

        <h2>
          Recuperar senha
        </h2>

        <p>
          Informe o e-mail utilizado no seu cadastro.
        </p>

      </section>


      <form
        id="formularioRecuperarSenha"
        class="formulario-login"
      >

        <div class="grupo-campo">

          <label for="emailRecuperacao">
            E-mail
          </label>

          <input
            id="emailRecuperacao"
            name="emailRecuperacao"
            type="email"
            placeholder="Digite seu e-mail"
            autocomplete="email"
            required
          >

        </div>


        <div
          id="mensagemRecuperacaoSenha"
          class="mensagem-login"
          role="alert"
          aria-live="polite"
        ></div>


        <button
          id="botaoEnviarRecuperacao"
          class="botao-entrar"
          type="submit"
        >
          Enviar recuperação
        </button>


        <a
          class="link-esqueci-senha"
          href="index.html"
        >
          Voltar para o login
        </a>

      </form>


    </section>

  </main>


  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="supabase.js?v=2"></script>

  <script src="recuperar-senha.js?v=1"></script>


</body>

</html>
