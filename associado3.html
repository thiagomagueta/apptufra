<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta name="theme-color" content="#651b1d">

  <title>Histórico na Umbanda | TUFRA</title>

  <link rel="stylesheet" href="style.css?v=11">
</head>

<body>
  <main class="tela-cadastro">

    <section class="cartao-cadastro">

      <header class="cabecalho-cadastro">

        <img
          class="logo-cadastro"
          src="logo-tufra.png"
          alt="Logo da Tenda de Umbanda Francisco de Assis"
        >

        <h1>Ficha do Associado</h1>

        <p>Histórico na Umbanda</p>

        <div class="progresso-cadastro">
          <div
            class="progresso-preenchido progresso-associado-3"
          ></div>
        </div>

        <small>Passo 3 de 4</small>

      </header>

      <form
        id="formularioAssociado3"
        class="formulario-cadastro"
        novalidate
      >

        <div class="grupo-campo">
          <label for="tempoUmbanda">
            Há quanto tempo é umbandista? *
          </label>

          <select
            id="tempoUmbanda"
            name="tempoUmbanda"
            required
          >
            <option value="">Selecione</option>
            <option value="Menos de 1 ano">
              Menos de 1 ano
            </option>
            <option value="1 a 5 anos">
              1 a 5 anos
            </option>
            <option value="6 a 10 anos">
              6 a 10 anos
            </option>
            <option value="Mais de 10 anos">
              Mais de 10 anos
            </option>
          </select>

          <small
            id="erroTempoUmbanda"
            class="mensagem-campo"
          ></small>
        </div>

        <fieldset class="grupo-opcoes">
          <legend>
            Já participou de outros terreiros? *
          </legend>

          <label class="opcao-radio">
            <input
              type="radio"
              name="participouOutrosTerreiros"
              value="Sim"
            >
            <span>Sim</span>
          </label>

          <label class="opcao-radio">
            <input
              type="radio"
              name="participouOutrosTerreiros"
              value="Não"
            >
            <span>Não</span>
          </label>

          <small
            id="erroOutrosTerreiros"
            class="mensagem-campo"
          ></small>
        </fieldset>

        <div
          id="areaQuantidadeTerreiros"
          class="grupo-campo campo-condicional"
          hidden
        >
          <label for="quantidadeTerreiros">
            De quantos terreiros já participou? *
          </label>

          <input
            id="quantidadeTerreiros"
            name="quantidadeTerreiros"
            type="number"
            placeholder="Informe a quantidade"
            inputmode="numeric"
            min="1"
          >

          <small
            id="erroQuantidadeTerreiros"
            class="mensagem-campo"
          ></small>
        </div>

        <div class="grupo-campo">
          <label for="religiaoBatismo">
            Religião de batismo *
          </label>

          <input
            id="religiaoBatismo"
            name="religiaoBatismo"
            type="text"
            placeholder="Informe sua religião de batismo"
            required
          >

          <small
            id="erroReligiaoBatismo"
            class="mensagem-campo"
          ></small>
        </div>

        <div class="grupo-campo">
          <label for="comoChegouUmbanda">
            Como chegou à Umbanda? *
          </label>

          <textarea
            id="comoChegouUmbanda"
            name="comoChegouUmbanda"
            rows="4"
            placeholder="Conte brevemente como conheceu ou chegou à Umbanda"
            required
          ></textarea>

          <small
            id="erroComoChegouUmbanda"
            class="mensagem-campo"
          ></small>
        </div>

        <fieldset class="grupo-opcoes">
          <legend>
            Já é batizado na Umbanda? *
          </legend>

          <label class="opcao-radio">
            <input
              type="radio"
              name="batizadoUmbanda"
              value="Sim"
            >
            <span>Sim</span>
          </label>

          <label class="opcao-radio">
            <input
              type="radio"
              name="batizadoUmbanda"
              value="Não"
            >
            <span>Não</span>
          </label>

          <small
            id="erroBatizadoUmbanda"
            class="mensagem-campo"
          ></small>
        </fieldset>

        <section
          id="areaDadosBatismo"
          class="area-condicional"
          hidden
        >

          <div class="grupo-campo">
            <label for="terreiroBatismo">
              Terreiro onde foi batizado *
            </label>

            <input
              id="terreiroBatismo"
              name="terreiroBatismo"
              type="text"
              placeholder="Nome do terreiro"
            >

            <small
              id="erroTerreiroBatismo"
              class="mensagem-campo"
            ></small>
          </div>

          <div class="grupo-campo">
            <label for="dataBatismoAnterior">
              Data do batismo *
            </label>

            <input
              id="dataBatismoAnterior"
              name="dataBatismoAnterior"
              type="text"
              placeholder="00/00/0000"
              inputmode="numeric"
              maxlength="10"
            >

            <small
              id="erroDataBatismo"
              class="mensagem-campo"
            ></small>
          </div>

          <div class="grupo-campo">
            <label for="cidadeBatismo">
              Cidade do batismo *
            </label>

            <input
              id="cidadeBatismo"
              name="cidadeBatismo"
              type="text"
              placeholder="Digite a cidade"
            >

            <small
              id="erroCidadeBatismo"
              class="mensagem-campo"
            ></small>
          </div>

          <div class="grupo-campo">
            <label for="estadoBatismo">
              Estado do batismo *
            </label>

            <select
              id="estadoBatismo"
              name="estadoBatismo"
            >
              <option value="">Selecione</option>
              <option value="AC">Acre</option>
              <option value="AL">Alagoas</option>
              <option value="AP">Amapá</option>
              <option value="AM">Amazonas</option>
              <option value="BA">Bahia</option>
              <option value="CE">Ceará</option>
              <option value="DF">Distrito Federal</option>
              <option value="ES">Espírito Santo</option>
              <option value="GO">Goiás</option>
              <option value="MA">Maranhão</option>
              <option value="MT">Mato Grosso</option>
              <option value="MS">Mato Grosso do Sul</option>
              <option value="MG">Minas Gerais</option>
              <option value="PA">Pará</option>
              <option value="PB">Paraíba</option>
              <option value="PR">Paraná</option>
              <option value="PE">Pernambuco</option>
              <option value="PI">Piauí</option>
              <option value="RJ">Rio de Janeiro</option>
              <option value="RN">Rio Grande do Norte</option>
              <option value="RS">Rio Grande do Sul</option>
              <option value="RO">Rondônia</option>
              <option value="RR">Roraima</option>
              <option value="SC">Santa Catarina</option>
              <option value="SP">São Paulo</option>
              <option value="SE">Sergipe</option>
              <option value="TO">Tocantins</option>
            </select>

            <small
              id="erroEstadoBatismo"
              class="mensagem-campo"
            ></small>
          </div>

        </section>

        <div class="grupo-campo">
          <label for="orixaFrente">
            Orixá de frente
          </label>

          <input
            id="orixaFrente"
            name="orixaFrente"
            type="text"
            placeholder="Preenchimento opcional"
          >
        </div>

        <div class="grupo-campo">
          <label for="orixaAdjunto">
            Orixá adjunto
          </label>

          <input
            id="orixaAdjunto"
            name="orixaAdjunto"
            type="text"
            placeholder="Preenchimento opcional"
          >
        </div>

        <div class="grupo-campo">
          <label for="melhorDiaPagamento">
            Melhor dia para pagamento *
          </label>

          <select
            id="melhorDiaPagamento"
            name="melhorDiaPagamento"
            required
          >
            <option value="">Selecione o dia</option>
          </select>

          <small
            id="erroMelhorDiaPagamento"
            class="mensagem-campo"
          ></small>
        </div>

        <div class="acoes-cadastro">

          <a
            class="botao-anterior"
            href="associado2.html"
          >
            Anterior
          </a>

          <button
            class="botao-solicitar"
            type="submit"
          >
            Próximo
          </button>

        </div>

      </form>

    </section>

  </main>

<script src="associado3.js?v=1"></script>
</body>
</html>
