<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#651b1d"
  >

  <title>
    Presença | TUFRA
  </title>

  <link
    rel="stylesheet"
    href="layout.css?v=39"
  >

</head>


<body>

  <main class="app">

    <div class="conteudo-app">


      <!-- =====================================
           CABEÇALHO
      ====================================== -->

      <header class="cabecalho-app">

        <img
          class="logo-app"
          src="logo-tufra.png"
          alt="Logo da TUFRA"
        >

        <div class="identidade-app">

          <strong>
            TUFRA
          </strong>

          <span>
            Tenda de Umbanda Francisco de Assis
          </span>

        </div>

      </header>


      <!-- =====================================
           TÍTULO
      ====================================== -->

      <section>

        <h1 class="titulo-pagina">
          Presença
        </h1>

        <p class="subtitulo-pagina">
          Preencha ou consulte as listas de presença.
        </p>

      </section>


      <!-- =====================================
           OPÇÕES
      ====================================== -->

      <section class="cartao-app">

        <div class="lista-acoes-administrativas">


          <!-- =================================
               RESPONSÁVEL PELA PRESENÇA
          ================================== -->

          <a
            id="opcaoPreencherPresencaAdm"
            class="item-acao-administrativa"
            href="listas-presenca.html"
            hidden
          >

            <span>
              Preencher lista de presença
            </span>

            <span class="seta-permissao-lista">
              ›
            </span>

          </a>


          <!-- =================================
               DIRETORIA
          ================================== -->

          <a
            id="opcaoConsultarPresencaAdm"
            class="item-acao-administrativa"
            href="consultar-atividades-presenca.html"
            hidden
          >

            <span>
              Listas de Presença por Trabalho
            </span>

            <span class="seta-permissao-lista">
              ›
            </span>

          </a>


        </div>

      </section>


      <!-- =====================================
           SEM OPÇÕES
      ====================================== -->

      <section
        id="semOpcoesPresencaAdm"
        class="cartao-app"
        hidden
      >

        <p>
          Não existem opções de presença disponíveis para sua função.
        </p>

      </section>


      <!-- =====================================
           VOLTAR
      ====================================== -->

      <a
        class="link-administrativo"
        href="administrativo.html"
      >
        Voltar ao Administrativo
      </a>


    </div>

  </main>


  <!-- =====================================
       MENU INFERIOR
  ====================================== -->

  <div id="menuGlobalTufra"></div>


  <!-- =====================================
       SCRIPTS
  ====================================== -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="supabase.js?v=2"></script>

  <script src="menu-global.js?v=1"></script>

  <script src="app.js?v=2"></script>

  <script src="adm-presenca.js?v=1"></script>

  <script src="menu-adm.js?v=1"></script>


  <script src="menu-financeiro.js?v=1"></script>

</body>

</html>
