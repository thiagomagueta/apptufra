<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#651b1d"
  >

  <title>
    Carômetro | TUFRA
  </title>

  <link
    rel="stylesheet"
    href="layout.css?v=39"
  >

</head>


<body>

  <main class="app">

    <div class="conteudo-app">


      <!-- =====================================
           CABEÇALHO
      ====================================== -->

      <header class="cabecalho-app">

        <img
          class="logo-app"
          src="logo-tufra.png"
          alt="Logo da TUFRA"
        >

        <div class="identidade-app">

          <strong>
            TUFRA
          </strong>

          <span>
            Tenda de Umbanda Francisco de Assis
          </span>

        </div>

      </header>


      <!-- =====================================
           TÍTULO
      ====================================== -->

      <section>

        <h1 class="titulo-pagina">
          Carômetro
        </h1>

        <p class="subtitulo-pagina">
          Consulte os associados pela foto.
        </p>

      </section>


      <!-- =====================================
           CARÔMETRO
      ====================================== -->

      <section class="cartao-app">

        <div
          id="listaCarometro"
          class="lista-carometro"
        >
          <p>
            Carregando associados...
          </p>
        </div>

        <div
          id="mensagemSemCarometro"
          class="mensagem-sem-atividades"
          hidden
        >
          Nenhum associado encontrado.
        </div>

      </section>


      <!-- =====================================
           VOLTAR
      ====================================== -->

      <a
        class="link-administrativo"
        href="adm-associados.html"
      >
        Voltar para Associados
      </a>


    </div>

  </main>


  <!-- =====================================
       MENU INFERIOR
  ====================================== -->

  <div id="menuGlobalTufra"></div>


  <!-- =====================================
       SCRIPTS
  ====================================== -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="supabase.js?v=2"></script>

  <script src="menu-global.js?v=1"></script>

  <script src="app.js?v=2"></script>

  <script src="carometro.js?v=2"></script>

  <script src="menu-adm.js?v=1"></script>


  <script src="menu-financeiro.js?v=1"></script>
</body>

</html>
