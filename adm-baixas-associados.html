<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#651b1d"
  >

  <title>
    Associados inativos | TUFRA
  </title>

  <link
    rel="stylesheet"
    href="layout.css?v=39"
  >

</head>


<body>

  <main class="app">

    <div class="conteudo-app">


      <!-- =====================================
           CABEÇALHO
      ====================================== -->

      <header class="cabecalho-app">

        <img
          class="logo-app"
          src="logo-tufra.png"
          alt="Logo da TUFRA"
        >

        <div class="identidade-app">

          <strong>
            TUFRA
          </strong>

          <span>
            Tenda de Umbanda Francisco de Assis
          </span>

        </div>

      </header>


      <!-- =====================================
           TÍTULO
      ====================================== -->

      <section>

        <h1 class="titulo-pagina">
          Associados inativos
        </h1>

        <p class="subtitulo-pagina">
          Consulte os associados que receberam baixa na TUFRA.
        </p>

      </section>


      <!-- =====================================
           LISTA
      ====================================== -->

      <section class="cartao-app">

        <div
          id="mensagemCarregamento"
          class="mensagem-formulario"
        >
          Carregando associados inativos...
        </div>


        <div
          id="listaAssociadosInativos"
          class="lista-acoes-administrativas"
          hidden
        >
        </div>


        <div
          id="mensagemSemAssociados"
          class="mensagem-formulario"
          hidden
        >
          Nenhum associado inativo encontrado.
        </div>

      </section>


      <!-- =====================================
           VOLTAR
      ====================================== -->

      <a
        class="link-administrativo"
        href="administrativo.html"
      >
        Voltar ao Administrativo
      </a>


    </div>

  </main>


  <!-- =====================================
       MENU INFERIOR
  ====================================== -->

  <nav
    class="menu-inferior"
    aria-label="Navegação principal"
  >

    <div class="menu-inferior-conteudo">


      <a
        class="item-menu"
        href="dashboard.html"
      >

        <span class="icone-menu">
          ⌂
        </span>

        <span class="texto-menu">
          Início
        </span>

      </a>


      <a
        class="item-menu"
        href="calendario.html"
      >

        <span class="icone-menu">
          📅
        </span>

        <span class="texto-menu">
          Calendário
        </span>

      </a>


      <a
        class="item-menu"
        href="minha-ficha.html"
      >

        <span class="icone-menu">
          👤
        </span>

        <span class="texto-menu">
          Minha ficha
        </span>

      </a>


      <!-- =================================
           ADM
      ================================== -->

      <a
        id="itemMenuAdm"
        class="item-menu ativo"
        href="administrativo.html"
        hidden
      >

        <span class="icone-menu">
          ☰
        </span>

        <span class="texto-menu">
          ADM
        </span>

      </a>


      <a
        class="item-menu"
        href="#"
        id="botaoSair"
      >

        <span class="icone-menu">
          🚪
        </span>

        <span class="texto-menu">
          Sair
        </span>

      </a>


    </div>

  </nav>


  <!-- =====================================
       SCRIPTS
  ====================================== -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="supabase.js?v=2"></script>

  <script src="app.js?v=2"></script>

  <script src="adm-baixas-associados.js?v=1"></script>

  <script src="menu-adm.js?v=1"></script>


</body>

</html>
