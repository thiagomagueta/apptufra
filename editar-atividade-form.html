<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta name="theme-color" content="#651b1d">

  <title>Editar atividade | TUFRA</title>

  <link rel="stylesheet" href="nova-atividade.css?v=2">
</head>

<body>

  <main class="pagina-nova-atividade">

    <header class="cabecalho-nova-atividade">

      <div class="marca-tufra">

        <img
          src="logo-tufra.png"
          alt="TUFRA"
          class="logo-tufra"
        >

        <div>
          <strong>TUFRA</strong>

          <span>
            Tenda de Umbanda Francisco de Assis
          </span>
        </div>

      </div>

    </header>


    <section class="titulo-pagina">

      <h1>
        Editar atividade
      </h1>

      <p>
        Altere os dados da atividade selecionada.
      </p>

    </section>


    <section class="cartao-nova-atividade">

      <form id="formEditarAtividade">

        <div class="campo-formulario">

          <label for="tituloAtividade">
            Título da atividade
          </label>

          <input
            type="text"
            id="tituloAtividade"
            maxlength="100"
            autocomplete="off"
            required
          >

        </div>


        <div class="campo-formulario">

          <label for="dataAtividade">
            Data
          </label>

          <input
            type="date"
            id="dataAtividade"
            required
          >

        </div>


        <div class="linha-horarios">

          <div class="campo-formulario">

            <label for="horaInicioAtividade">
              Hora de início
            </label>

            <input
              type="time"
              id="horaInicioAtividade"
              required
            >

          </div>


          <div class="campo-formulario">

            <label for="horaFimAtividade">
              Hora de fim
            </label>

            <input
              type="time"
              id="horaFimAtividade"
            >

            <small>
              Opcional
            </small>

          </div>

        </div>


        <div class="campo-formulario">

          <label for="tipoAtividade">
            Tipo da atividade
          </label>

          <select
            id="tipoAtividade"
            required
          >

            <option value="">
              Selecione
            </option>

            <option value="gira_principal">
              Gira Principal
            </option>

            <option value="gira_desenvolvimento">
              Gira de Desenvolvimento
            </option>

            <option value="aula">
              Aula
            </option>

            <option value="trabalho_cura">
              Trabalho de Cura
            </option>

            <option value="eventos">
              Eventos
            </option>

            <option value="obrigacoes">
              Obrigações
            </option>

            <option value="outros">
              Outros
            </option>

          </select>

        </div>


        <div
          id="areaTipoOutro"
          class="campo-formulario"
          hidden
        >

          <label for="tipoOutroAtividade">
            Qual tipo de atividade?
          </label>

          <input
            type="text"
            id="tipoOutroAtividade"
            maxlength="100"
            autocomplete="off"
          >

        </div>


        <div class="campo-formulario">

          <label for="observacaoAtividade">
            Observação
          </label>

          <textarea
            id="observacaoAtividade"
            rows="4"
            maxlength="500"
          ></textarea>

          <small>
            Opcional
          </small>

        </div>


        <p
          id="mensagemEditarAtividade"
          class="mensagem-formulario"
          hidden
        ></p>


        <button
          type="submit"
          id="botaoSalvarAtividade"
          class="botao-cadastrar-atividade"
        >
          Salvar alterações
        </button>

      </form>

    </section>


    <a
      href="editar-atividade.html"
      class="voltar-administrativo"
    >
      Voltar para atividades
    </a>

  </main>


  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js?v=2"></script>
  <script src="editar-atividade-form.js?v=1"></script>

</body>
</html>
