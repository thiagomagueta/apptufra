
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta name="theme-color" content="#651b1d">

  <title>Login | Gestão TUFRA</title>

  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">

  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="tela-login">

    <section class="cartao-login">

      <header class="cabecalho-login">
        <img
          class="logo-tufra"
          src="logo-tufra.png"
          alt="Logo da Tenda de Umbanda Francisco de Assis"
        >

        <h1>TUFRA</h1>

        <p>
          Tenda de Umbanda Francisco de Assis
        </p>
      </header>

      <section
        id="areaConfirmacaoEmail"
        hidden
        aria-live="polite"
      >
        <h2 id="tituloConfirmacaoEmail">
          Confirme seu e-mail
        </h2>

        <p id="textoConfirmacaoEmail">
          Você pode solicitar um novo link
          de confirmação.
        </p>

        <div
          id="areaEmailReenvio"
          class="grupo-campo"
          hidden
        >
          <label for="emailReenvio">
            E-mail do cadastro
          </label>

          <input
            id="emailReenvio"
            type="email"
            placeholder="Digite seu e-mail"
            autocomplete="email"
          >
        </div>

        <div
          id="mensagemReenvio"
          class="mensagem-login"
          role="status"
          aria-live="polite"
        ></div>

        <button
          id="botaoReenviarConfirmacao"
          class="botao-entrar"
          type="button"
        >
          Reenviar e-mail de confirmação
        </button>

        <p>
          Confirme seu e-mail em até
          30 minutos após receber o novo link.
        </p>
      </section>

      <form
        id="formularioLogin"
        class="formulario-login"
      >

        <div class="grupo-campo">
          <label for="login">E-mail</label>

          <input
            id="login"
            name="login"
            type="email"
            placeholder="Digite seu e-mail"
            autocomplete="email"
            required
          >
        </div>

        <div class="grupo-campo">
          <label for="senha">🔒 Senha</label>

          <div class="campo-senha">
            <input
              id="senha"
              name="senha"
              type="password"
              placeholder="Digite sua senha"
              autocomplete="current-password"
              required
            >

            <button
              id="botaoMostrarSenha"
              class="botao-mostrar-senha"
              type="button"
              aria-label="Mostrar senha"
            >
              👁
            </button>
          </div>
        </div>

        <div
          id="mensagemLogin"
          class="mensagem-login"
          role="alert"
          aria-live="polite"
        ></div>

        <a
          id="linkEsqueciSenha"
          class="link-esqueci-senha"
          href="#"
        >
          Esqueci minha senha
        </a>

        <button
          class="botao-entrar"
          type="submit"
        >
          Entrar
        </button>

      </form>

      <footer class="rodape-login">
        <p>Ainda não possui acesso?</p>

        <a
          id="linkCadastrar"
          href="cadastro.html"
        >
          Criar cadastro
        </a>
      </footer>

    </section>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js?v=2"></script>
  <script src="script.js?v=4"></script>
  <script src="pwa.js?v=1"></script>

</body>
</html>
