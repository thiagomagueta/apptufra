<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta name="theme-color" content="#651b1d">

  <title>Login | Gestão TUFRA</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="tela-login">

    <section class="cartao-login">

      <header class="cabecalho-login">
        <img
          class="logo-tufra"
          src="logo-tufra.png"
          alt="Logo da Tenda de Umbanda Francisco de Assis"
        >

        <h1>TUFRA</h1>

        <p>
          Tenda de Umbanda Francisco de Assis
        </p>
      </header>

      <form id="formularioLogin" class="formulario-login">

        <div class="grupo-campo">
          <label for="login">Usuário</label>

          <input
            id="login"
            name="login"
            type="text"
            placeholder="Digite seu usuário"
            autocomplete="username"
            required
          >
        </div>

        <div class="grupo-campo">
          <label for="senha">🔒 Senha</label>

          <div class="campo-senha">
            <input
              id="senha"
              name="senha"
              type="password"
              placeholder="Digite sua senha"
              autocomplete="current-password"
              required
            >

            <button
              id="botaoMostrarSenha"
              class="botao-mostrar-senha"
              type="button"
              aria-label="Mostrar senha"
            >
              👁
            </button>
          </div>
        </div>

        <div
          id="mensagemLogin"
          class="mensagem-login"
          role="alert"
          aria-live="polite"
        ></div>

        <a
          id="linkEsqueciSenha"
          class="link-esqueci-senha"
          href="#"
        >
          Esqueci minha senha
        </a>

        <button
          class="botao-entrar"
          type="submit"
        >
          Entrar
        </button>

      </form>

      <footer class="rodape-login">
        <p>Ainda não possui acesso?</p>

        <a
          id="linkCadastrar"
          href="cadastro.html"
        >
          Criar cadastro
        </a>
      </footer>

    </section>

  </main>

  <script src="script.js"></script>
</body>
</html>
