<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#651b1d"
  >

  <title>
    Relatórios | TUFRA
  </title>

  <link
    rel="stylesheet"
    href="layout.css?v=39"
  >

</head>


<body>

  <main class="app">

    <div class="conteudo-app">

           CABEÇALHO
      ====================================== -->

      <header class="cabecalho-app">

        <img
          class="logo-app"
          src="logo-tufra.png"
          alt="Logo da TUFRA"

        <div class="identidade-app">

          <strong>
            TUFRA
          </strong>

          <span>
            Tenda de Umbanda Francisco de Assis
          </span>

        </div>

      </header>


      <!-- =====================================
           TÍTULO
      ====================================== -->

      <section>

        <h1 class="titulo-pagina">
          Relatórios
        </h1>

        <p class="subtitulo-pagina">
          Consulte os relatórios de presença.
        </p>

      </section>


      <!-- =====================================
           OPÇÕES
      ====================================== -->

      <section class="cartao-app">

        <div class="lista-acoes-administrativas">


          <!-- RELATÓRIO GERAL -->

          <a
            class="item-acao-administrativa"
            href="relatorio-presenca-lista.html"
          >

            <span>
              Relatório geral de presença
            </span>

            <span class="seta-permissao-lista">
              ›
            </span>

          </a>


          <!-- RELATÓRIO POR ATIVIDADE -->

          <a
            class="item-acao-administrativa"
            href="relatorio-atividade-lista.html"
          >

            <span>
              Relatório por atividade
            </span>

            <span class="seta-permissao-lista">
              ›
            </span>

          </a>


          <!-- RELATÓRIO POR ASSOCIADO -->

          <a
            class="item-acao-administrativa"
            href="relatorio-associado-presenca.html"
          >

            <span>
              Relatório por associado
            </span>

            <span class="seta-permissao-lista">
              ›
            </span>

          </a>


          <!-- RELATÓRIO DE JUSTIFICATIVAS -->

          <a
            class="item-acao-administrativa"
            href="relatorio-justificativas.html"
          >

            <span>
              Relatório de Justificativas
            </span>

            <span class="seta-permissao-lista">
              ›
            </span>

          </a>


        </div>

      </section>


      <!-- =====================================
           VOLTAR
      ====================================== -->

      <a
        class="link-administrativo"
        href="administrativo.html"
      >
        Voltar ao Administrativo
      </a>


    </div>

  </main>


  <!-- =====================================
       MENU INFERIOR
  ====================================== -->

  <nav
    class="menu-inferior"
    aria-label="Navegação principal"
  >

    <div class="menu-inferior-conteudo">


      <a
        class="item-menu"
        href="dashboard.html"
      >

        <span class="icone-menu">
          ⌂
        </span>

        <span class="texto-menu">
          Início
        </span>

      </a>


      <a
        class="item-menu"
        href="calendario.html"
      >

        <span class="icone-menu">
          📅
        </span>

        <span class="texto-menu">
          Calendário
        </span>

      </a>


      <a
        class="item-menu"
        href="minha-ficha.html"
      >

        <span class="icone-menu">
          👤
        </span>

        <span class="texto-menu">
          Minha ficha
        </span>

      </a>

           ADM
      ================================== -->

      <a
        id="itemMenuAdm"
        class="item-menu ativo"

        </span>

        </span>

        </span>

        <span class="texto-menu">
          Sair

  <script src="supabase.js?v=2"></script>

  <script src="app.js?v=2"></script>

  <script src="adm-relatorios.js?v=1"></script>

  <script src="menu-adm.js?v=1"></script>
