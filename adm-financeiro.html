<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#651b1d"
  >

  <title>
    Financeiro | TUFRA
  </title>

  <link
    rel="stylesheet"
    href="layout.css?v=40"
  >

</head>


<body>

  <main class="app">

    <div class="conteudo-app">


      <!-- =====================================
           CABEÇALHO
      ====================================== -->

      <header class="cabecalho-app">

        <img
          class="logo-app"
          src="logo-tufra.png"
          alt="Logo da TUFRA"
        >

        <div class="identidade-app">

          <strong>
            TUFRA
          </strong>

          <span>
            Tenda de Umbanda Francisco de Assis
          </span>

        </div>

      </header>


      <!-- =====================================
           TÍTULO
      ====================================== -->

      <section>

        <h1 class="titulo-pagina">
          Financeiro
        </h1>

        <p class="subtitulo-pagina">
          Gestão financeira da TUFRA.
        </p>

      </section>


      <!-- =====================================
           OPÇÕES
      ====================================== -->

      <section
        id="conteudoFinanceiro"
        class="cartao-app"
        hidden
      >

        <div class="lista-acoes-administrativas">


          <a class="item-acao-administrativa" href="financeiro-grupos.html">
            <span>Grupos de pagamento</span>
            <span class="seta-permissao-lista">›</span>
          </a>

          <!-- =================================
               OBRIGAÇÕES
          ================================== -->

          <a
            class="item-acao-administrativa"
            href="financeiro-obrigacoes.html"
          >

            <span>
              Obrigações
            </span>

            <span class="seta-permissao-lista">
              ›
            </span>

          </a>


        </div>

      </section>


      <!-- =====================================
           VOLTAR
      ====================================== -->

      <a
        class="link-administrativo"
        href="administrativo.html"
      >
        Voltar ao Administrativo
      </a>


    </div>

  </main>


  <!-- =====================================
       MENU INFERIOR
  ====================================== -->

  <div id="menuGlobalTufra"></div>


  <!-- =====================================
       SCRIPTS
  ====================================== -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="supabase.js?v=2"></script>

  <script src="menu-global.js?v=1"></script>

  <script src="app.js?v=2"></script>

  <script src="adm-financeiro.js?v=1"></script>

  <script src="menu-adm.js?v=1"></script>


  <script src="menu-financeiro.js?v=1"></script>

</body>

</html>
